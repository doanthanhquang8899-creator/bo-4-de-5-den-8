</style><body><header><a href="#" id="logo">✦ <b>GDQP<span>&</span>AN</b><small>KHÔNG GIAN ÔN LUYỆN</small></a><button id="home">Tổng quan ↗</button></header><main id="app"></main><footer>Học chắc kiến thức · Vững vàng bước vào hội thi<br>Chấm theo đáp án trong tài liệu gốc. Chưa thẩm định tính chính xác và hiệu lực các nội dung.</footer><script>const QUESTIONS=[{"id": 1, "set": 5, "number": 1, "level": "Nhận biết", "text": "Theo Điều 33 Luật Giáo dục quốc phòng và an ninh, cơ quan nào thống nhất quản lý nhà nước về giáo dục quốc phòng và an ninh trong phạm vi cả nước?", "options": ["Chính phủ", "Bộ Giáo dục và Đào tạo", "Bộ Quốc phòng", "Quốc hội"], "answer": 0, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 33 khoản 1.", "explanation": ""}, {"id": 2, "set": 5, "number": 2, "level": "Nhận biết", "text": "Nghị định số 13/2014/NĐ-CP quy định chi tiết và biện pháp thi hành Luật Giáo dục quốc phòng và an ninh được Chính phủ ban hành vào ngày, tháng, năm nào?", "options": ["Ngày 02/11/2020", "Ngày 10/4/2014", "Ngày 25/02/2014", "Ngày 19/6/2013"], "answer": 2, "source": "Nghị định 13/2014/NĐ-CP (VBHN số 53/VBHN-BQP ngày 09/9/2025), phần đầu văn bản.", "explanation": ""}, {"id": 3, "set": 5, "number": 3, "level": "Nhận biết", "text": "Theo Chương trình môn Giáo dục quốc phòng và an ninh cấp trung học phổ thông, 35 tiết của lớp 10 được phân bổ như thế nào?", "options": ["18 tiết lí thuyết, 17 tiết thực hành", "20 tiết lí thuyết, 15 tiết thực hành", "19 tiết lí thuyết, 16 tiết thực hành", "17 tiết lí thuyết, 18 tiết thực hành"], "answer": 0, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.2 (lớp 10).", "explanation": ""}, {"id": 4, "set": 5, "number": 4, "level": "Nhận biết", "text": "Theo Thông tư 22/2021/TT-BGDĐT, môn học đánh giá bằng nhận xét kết hợp điểm số có trên 70 tiết/năm học thì mỗi học kì chọn bao nhiêu điểm đánh giá thường xuyên?", "options": ["05 điểm", "03 điểm", "04 điểm", "02 điểm"], "answer": 2, "source": "Thông tư 22/2021/TT-BGDĐT, Điều 6 khoản 2 điểm b.", "explanation": ""}, {"id": 5, "set": 5, "number": 5, "level": "Nhận biết", "text": "Ai là người trực tiếp chỉ huy Đội Việt Nam Tuyên truyền Giải phóng quân khi thành lập ngày 22/12/1944?", "options": ["Đồng chí Võ Nguyên Giáp", "Đồng chí Hoàng Văn Thái", "Đồng chí Chu Văn Tấn", "Đồng chí Văn Tiến Dũng"], "answer": 0, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 1, mục “Lịch sử Quân đội nhân dân Việt Nam”.", "explanation": ""}, {"id": 6, "set": 5, "number": 6, "level": "Nhận biết", "text": "Theo sách giáo khoa lớp 10, Luật Sĩ quan Quân đội nhân dân Việt Nam năm 1999 (sửa đổi, bổ sung năm 2008 và 2014) gồm bao nhiêu chương, bao nhiêu điều?", "options": ["9 chương, 62 điều", "7 chương, 46 điều", "7 chương, 51 điều", "8 chương, 47 điều"], "answer": 2, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 2, mục “Luật Sĩ quan Quân đội nhân dân Việt Nam”.", "explanation": ""}, {"id": 7, "set": 5, "number": 7, "level": "Nhận biết", "text": "Công ước của Liên hợp quốc về Luật Biển năm 1982 chính thức có hiệu lực từ ngày nào?", "options": ["Ngày 21/6/2012", "Ngày 16/11/1994", "Ngày 23/6/1994", "Ngày 10/12/1982"], "answer": 1, "source": "SGK GDQP-AN 11, bài “Bảo vệ chủ quyền lãnh thổ, biên giới quốc gia” (nội dung 7), mục “Công ước Liên hợp quốc về Luật Biển năm 1982”.", "explanation": ""}, {"id": 8, "set": 5, "number": 8, "level": "Nhận biết", "text": "Ngày 3/5/1975, tập đoàn Pol Pot – Ieng Sary cho quân đánh chiếm đảo nào của Việt Nam?", "options": ["Đảo Phú Quốc", "Đảo Côn Sơn", "Đảo Hòn Khoai", "Đảo Thổ Chu"], "answer": 0, "source": "SGK GDQP-AN 12, bài “Bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa sau năm 1975” (nội dung 12), tư liệu về chiến tranh bảo vệ biên giới Tây Nam.", "explanation": ""}, {"id": 9, "set": 5, "number": 9, "level": "Thông hiểu", "text": "Phạm vi điều chỉnh của Luật Giáo dục quốc phòng và an ninh được xác định tại Điều 1 là gì?", "options": ["Hệ thống giáo dục quốc dân; cơ sở giáo dục, nhà giáo, người học; quản lý nhà nước về giáo dục và trách nhiệm của các cơ quan liên quan", "Nghĩa vụ quân sự; nhiệm vụ, quyền hạn của cơ quan, tổ chức, cá nhân và chế độ, chính sách trong việc thực hiện nghĩa vụ quân sự của công dân", "Nguyên tắc, chính sách, nội dung cơ bản, hình thức giáo dục quốc phòng và an ninh; nhiệm vụ, quyền hạn của cơ quan, tổ chức, công dân", "Tổ chức, biên chế, trang bị của lực lượng vũ trang nhân dân và chế độ, chính sách đối với sĩ quan, quân nhân chuyên nghiệp, hạ sĩ quan, binh sĩ"], "answer": 2, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 1.", "explanation": ""}, {"id": 10, "set": 5, "number": 10, "level": "Thông hiểu", "text": "Theo Điều 3 Luật Giáo dục quốc phòng và an ninh, “kiến thức quốc phòng và an ninh” bao gồm những nội dung nào?", "options": ["Các kiến thức về phòng thủ dân sự, phòng không nhân dân, phòng chống cháy nổ, thiên tai, dịch bệnh và kĩ thuật cấp cứu, chuyển thương", "Kỹ thuật, chiến thuật quân sự của từng người, tổ, tiểu đội và các quy định của điều lệnh quản lý bộ đội, điều lệnh Công an nhân dân", "Lịch sử, truyền thống của lực lượng vũ trang nhân dân và nghệ thuật quân sự Việt Nam qua các thời kì dựng nước và giữ nước", "Quan điểm của Đảng, chính sách, pháp luật của Nhà nước về quốc phòng, an ninh; truyền thống dựng nước, giữ nước và kỹ năng quân sự"], "answer": 3, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 3 khoản 1.", "explanation": ""}, {"id": 11, "set": 5, "number": 11, "level": "Thông hiểu", "text": "Theo Điều 14 Luật Giáo dục quốc phòng và an ninh, nhóm nào sau đây thuộc đối tượng bồi dưỡng kiến thức quốc phòng và an ninh trong cơ quan, tổ chức của Nhà nước, tổ chức chính trị, tổ chức chính trị – xã hội?", "options": ["Chủ tàu, thuyền hoạt động dài ngày trên biển; chủ hộ gia đình ở khu vực biên giới, hải đảo", "Cán bộ, công chức, viên chức quản lý; đại biểu dân cử; trưởng thôn; đảng viên", "Học sinh trung học phổ thông; sinh viên cao đẳng, đại học; học viên các trường nghề", "Chức sắc, chức việc tôn giáo; già làng; trưởng họ tộc; nhà hoạt động văn hoá, nghệ thuật"], "answer": 1, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 14 khoản 2 (so sánh với Điều 16, Điều 21).", "explanation": ""}, {"id": 12, "set": 5, "number": 12, "level": "Thông hiểu", "text": "Nội dung nào sau đây là một hình thức phổ biến kiến thức quốc phòng và an ninh cho toàn dân quy định tại Điều 20 Luật Giáo dục quốc phòng và an ninh?", "options": ["Lồng ghép vào các đợt gọi công dân nhập ngũ, ngày kỷ niệm, ngày truyền thống", "Dạy học chính khoá theo phân phối chương trình của từng lớp học", "Tổ chức học tập trung tại trung tâm giáo dục quốc phòng và an ninh của quân khu, của tỉnh", "Đào tạo văn bằng 2 chuyên ngành giáo dục quốc phòng và an ninh"], "answer": 0, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 20 khoản 3.", "explanation": ""}, {"id": 13, "set": 5, "number": 13, "level": "Thông hiểu", "text": "Quan điểm “tính thực hành, thực tiễn” trong xây dựng Chương trình môn Giáo dục quốc phòng và an ninh cấp trung học phổ thông được hiểu như thế nào?", "options": ["Chương trình chỉ gồm các nội dung thực hành kĩ thuật, chiến thuật bộ binh; phần lí thuyết do học sinh tự nghiên cứu ở nhà theo tài liệu", "Nội dung thực hành do từng nhà trường tự quyết định, không cần bám sát yêu cầu cần đạt được quy định cho mỗi lớp học", "Thực hành, luyện tập, vận dụng là nội dung quan trọng, đồng thời là phương thức thiết thực, hiệu quả để phát triển phẩm chất, năng lực", "Thực hành chỉ được tổ chức tại các đơn vị quân đội, không tổ chức trong nhà trường để bảo đảm an toàn cho người học"], "answer": 2, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục II.3.", "explanation": ""}, {"id": 14, "set": 5, "number": 14, "level": "Thông hiểu", "text": "Theo Chương trình môn Giáo dục quốc phòng và an ninh cấp trung học phổ thông, khi dạy các bài học lí thuyết, giáo viên cần sử dụng phương pháp nào?", "options": ["Giao toàn bộ nội dung bài học cho học sinh tự đọc sách giáo khoa và ghi chép lại", "Thuyết trình một chiều để truyền đạt đầy đủ nội dung bài học trong thời gian ngắn nhất", "Làm động tác mẫu trên vũ khí, trang bị rồi cho học sinh luyện tập theo từng tổ, nhóm", "Nêu vấn đề, tạo tình huống có vấn đề để học sinh chủ động hình thành kiến thức mới"], "answer": 3, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục VI.2.1.", "explanation": ""}, {"id": 15, "set": 5, "number": 15, "level": "Thông hiểu", "text": "Mục đích đánh giá học sinh theo Điều 3 Thông tư 22/2021/TT-BGDĐT là gì?", "options": ["Xác định mức độ hoàn thành chỉ tiêu thi đua của giáo viên bộ môn, giáo viên chủ nhiệm và của tổ chuyên môn trong từng học kì", "Xếp thứ hạng học sinh trong lớp, trong trường để làm căn cứ khen thưởng, kỉ luật và phân chia lớp học theo trình độ của học sinh", "Lựa chọn học sinh tham gia các đội tuyển học sinh giỏi và hội thao giáo dục quốc phòng và an ninh cấp trường, cấp tỉnh hằng năm", "Xác định mức độ hoàn thành nhiệm vụ rèn luyện, học tập; cung cấp thông tin để điều chỉnh hoạt động học tập và dạy học"], "answer": 3, "source": "Thông tư 22/2021/TT-BGDĐT, Điều 3.", "explanation": ""}, {"id": 16, "set": 5, "number": 16, "level": "Thông hiểu", "text": "Theo Điều 13 Luật Nhà giáo năm 2025, chuẩn nghề nghiệp nhà giáo bao gồm những tiêu chuẩn nào?", "options": ["Tiêu chuẩn về số giờ dạy mỗi năm; tiêu chuẩn về số sáng kiến kinh nghiệm; tiêu chuẩn về kết quả thi của học sinh", "Tiêu chuẩn về thâm niên công tác; tiêu chuẩn về chức vụ quản lý; tiêu chuẩn về danh hiệu thi đua đã đạt được", "Tiêu chuẩn về đạo đức nhà giáo; tiêu chuẩn trình độ đào tạo, bồi dưỡng; tiêu chuẩn năng lực chuyên môn, nghiệp vụ", "Tiêu chuẩn về sức khoẻ; tiêu chuẩn về độ tuổi tuyển dụng; tiêu chuẩn về nơi cư trú và hoàn cảnh gia đình"], "answer": 2, "source": "Luật Nhà giáo số 73/2025/QH15, Điều 13 khoản 1.", "explanation": ""}, {"id": 17, "set": 5, "number": 17, "level": "Thông hiểu", "text": "Theo sách giáo khoa lớp 10, trong những năm đầu sau khi thành lập, nghệ thuật quân sự của Quân đội ta chủ yếu vận dụng lối đánh nào?", "options": ["Lối đánh du kích, bí mật, nhanh chóng, di chuyển linh hoạt", "Lối đánh chính quy, hiệp đồng quân chủng, binh chủng quy mô lớn", "Lối đánh phòng ngự trận địa dài ngày ở các đô thị, trung tâm lớn", "Lối đánh công kiên vào các cứ điểm kiên cố có công sự vững chắc"], "answer": 0, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 1, mục “Lịch sử Quân đội nhân dân Việt Nam”.", "explanation": ""}, {"id": 18, "set": 5, "number": 18, "level": "Thông hiểu", "text": "Theo Điều 1 Luật Sĩ quan Quân đội nhân dân Việt Nam (trích trong sách giáo khoa lớp 10), sĩ quan Quân đội nhân dân Việt Nam là ai?", "options": ["Là công dân đang thực hiện nghĩa vụ quân sự tại ngũ, được phong quân hàm Binh nhì, Binh nhất, Hạ sĩ, Trung sĩ, Thượng sĩ", "Là cán bộ của Đảng và Nhà nước, hoạt động trong lĩnh vực quân sự, được Nhà nước phong quân hàm cấp Uý, cấp Tá, cấp Tướng", "Là người thuộc lực lượng vũ trang quần chúng không thoát li sản xuất, công tác, được tổ chức ở địa phương và cơ quan, tổ chức", "Là công chức quốc phòng làm việc trong các cơ quan, đơn vị quân đội nhưng không được phong, thăng quân hàm theo quy định"], "answer": 1, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 2, mục “Luật Sĩ quan Quân đội nhân dân Việt Nam” (trích Điều 1).", "explanation": ""}, {"id": 19, "set": 5, "number": 19, "level": "Thông hiểu", "text": "Theo sách giáo khoa lớp 10, vi phạm pháp luật về trật tự an toàn giao thông được hiểu là gì?", "options": ["Là hành vi không phù hợp với chuẩn mực đạo đức, văn hoá giao thông, dù chưa được pháp luật về giao thông quy định", "Là hành vi trái pháp luật, có lỗi của người có năng lực thực hiện hành vi, được quy định bởi pháp luật về trật tự an toàn giao thông", "Là mọi tai nạn giao thông xảy ra trên đường bộ, đường sắt, đường thuỷ và đường hàng không, không phụ thuộc vào lỗi của người tham gia", "Là hành vi của người tham gia giao thông gây thiệt hại về người hoặc tài sản từ mức nghiêm trọng trở lên và bị truy cứu hình sự"], "answer": 1, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 4, mục “Vi phạm pháp luật về trật tự an toàn giao thông”.", "explanation": ""}, {"id": 20, "set": 5, "number": 20, "level": "Thông hiểu", "text": "Theo sách giáo khoa lớp 10, một thủ đoạn phổ biến mà đối tượng xấu dùng để đánh cắp thông tin cá nhân của người dùng là gì?", "options": ["Hướng dẫn người dùng chia sẻ thông tin cá nhân có chọn lọc khi tham gia mạng xã hội và không trả lời tin nhắn lạ", "Lập các trang mạng có nội dung hấp dẫn; khi người dùng truy cập sẽ tự động cài mã độc vào máy để thu thập thông tin", "Khuyến cáo người dùng thường xuyên cập nhật hệ điều hành mới nhất và sử dụng phần mềm diệt vi rút có bản quyền", "Yêu cầu người dùng đặt mật khẩu có độ an toàn cao và kích hoạt tính năng xác thực nhiều bước cho tài khoản của mình"], "answer": 1, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 6, mục “Một số thủ đoạn đánh cắp thông tin cá nhân người dùng”.", "explanation": ""}, {"id": 21, "set": 5, "number": 21, "level": "Thông hiểu", "text": "Mục tiêu của Chiến lược bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa trong tình hình mới bao gồm nội dung nào sau đây?", "options": ["Mở rộng phạm vi ảnh hưởng quân sự của Việt Nam ra khu vực và tham gia các liên minh quân sự với nước lớn", "Giữ vững ổn định chính trị bằng cách hạn chế tối đa giao lưu, hội nhập quốc tế trên mọi lĩnh vực", "Bảo vệ vững chắc độc lập, chủ quyền, thống nhất, toàn vẹn lãnh thổ; bảo vệ Đảng, Nhà nước, Nhân dân", "Ưu tiên phát triển kinh tế trước, chỉ quan tâm đến quốc phòng, an ninh khi đất nước có nguy cơ chiến tranh"], "answer": 2, "source": "SGK GDQP-AN 11, bài “Bảo vệ chủ quyền lãnh thổ, biên giới quốc gia” (nội dung 7), mục “Mục tiêu”.", "explanation": ""}, {"id": 22, "set": 5, "number": 22, "level": "Thông hiểu", "text": "Theo sách giáo khoa lớp 11, tệ nạn ma tuý được hiểu như thế nào?", "options": ["Là tình trạng lợi dụng các hình thức vui chơi, giải trí để cá cược, sát phạt nhau bằng tiền hoặc hiện vật trái pháp luật", "Là mọi hành vi sản xuất, mua bán, vận chuyển, tàng trữ trái phép chất ma tuý đã bị toà án kết án bằng bản án hình sự có hiệu lực pháp luật", "Là tình trạng sử dụng trái phép, nghiện ma tuý và các hành vi vi phạm pháp luật về ma tuý chưa đến mức bị truy cứu trách nhiệm hình sự", "Là việc sử dụng thuốc gây nghiện, thuốc hướng thần theo chỉ định của bác sĩ trong các cơ sở khám bệnh, chữa bệnh được cấp phép"], "answer": 2, "source": "SGK GDQP-AN 11, bài “Phòng chống tệ nạn xã hội ở Việt Nam trong thời kì hội nhập quốc tế” (nội dung 8), mục “Một số loại tệ nạn xã hội”.", "explanation": ""}, {"id": 23, "set": 5, "number": 23, "level": "Thông hiểu", "text": "Theo sách giáo khoa lớp 12, bạo loạn lật đổ là gì?", "options": ["Là hành động chống phá bằng bạo lực, có tổ chức nhằm gây rối loạn an ninh chính trị hoặc lật đổ chính quyền", "Là chiến lược lật đổ chế độ chính trị của các nước tiến bộ từ bên trong, được tiến hành chủ yếu bằng các biện pháp phi quân sự", "Là các vụ khiếu kiện đông người, kéo dài của người dân về đất đai, môi trường diễn ra đúng theo quy định của pháp luật", "Là cuộc chiến tranh xâm lược bằng vũ khí công nghệ cao do quân đội nước ngoài trực tiếp tiến hành từ bên ngoài lãnh thổ"], "answer": 0, "source": "SGK GDQP-AN 12, bài “Một số hiểu biết về chiến lược “diễn biến hoà bình”, bạo loạn lật đổ” (nội dung 15), mục “Khái niệm”.", "explanation": ""}, {"id": 24, "set": 5, "number": 24, "level": "Thông hiểu", "text": "Truyền thống “độc lập tự chủ, tự lực, tự cường, càng đánh càng mạnh” của lực lượng vũ trang địa phương được thể hiện ở tinh thần nào?", "options": ["Dựa vào sức mình là chính, đem sức ta mà giải phóng cho ta; phát huy sức mạnh tại chỗ, chủ động đánh địch", "Chờ bộ đội chủ lực về địa phương rồi mới tổ chức đánh địch để bảo toàn lực lượng và vũ khí, trang bị hiện có", "Chỉ chiến đấu khi được cấp đủ vũ khí, trang bị hiện đại ngang bằng với vũ khí, trang bị của quân địch", "Tránh đối đầu với địch, tập trung sản xuất và chỉ làm nhiệm vụ tiếp tế, phục vụ cho các đơn vị chủ lực"], "answer": 0, "source": "SGK GDQP-AN 12, bài “Truyền thống và nghệ thuật đánh giặc giữ nước của địa phương” (nội dung 16), mục “Một số nét chính về truyền thống của lực lượng vũ trang địa phương”.", "explanation": ""}, {"id": 25, "set": 5, "number": 25, "level": "Vận dụng", "text": "Một tổ chức phi chính phủ nước ngoài đang hoạt động trên lãnh thổ Việt Nam cho rằng Luật Giáo dục quốc phòng và an ninh chỉ áp dụng với cơ quan, tổ chức, công dân Việt Nam. Theo Điều 2 của Luật, nhận định nào đúng?", "options": ["Chưa đúng, vì mọi nhân viên của tổ chức nước ngoài đều phải học môn Giáo dục quốc phòng và an ninh", "Đúng, vì tổ chức nước ngoài chỉ phải tuân theo các điều ước quốc tế mà Việt Nam đã kí kết hoặc gia nhập", "Chưa đúng, vì tổ chức, cá nhân nước ngoài cư trú, hoạt động tại Việt Nam có trách nhiệm tuân theo Luật này", "Đúng, vì giáo dục quốc phòng và an ninh là công việc nội bộ, chỉ liên quan đến công dân mang quốc tịch Việt Nam"], "answer": 2, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 2 khoản 2.", "explanation": ""}, {"id": 26, "set": 5, "number": 26, "level": "Vận dụng", "text": "Ông A là công dân Việt Nam, giám đốc một doanh nghiệp tư nhân quy mô vừa; ông B là người nước ngoài, quản lý một doanh nghiệp ngoài khu vực nhà nước hoạt động ở vùng biên giới. Theo Điều 15 Luật Giáo dục quốc phòng và an ninh, ai phải tham gia bồi dưỡng kiến thức quốc phòng và an ninh?", "options": ["Không ai phải tham gia, vì đây là doanh nghiệp ngoài nhà nước", "Chỉ ông A, vì quy định này không áp dụng cho người nước ngoài", "Chỉ ông B, vì doanh nghiệp của ông hoạt động ở vùng biên giới", "Cả ông A và ông B, vì cả hai đều là người quản lý doanh nghiệp"], "answer": 1, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 15 khoản 1, khoản 4.", "explanation": ""}, {"id": 27, "set": 5, "number": 27, "level": "Vận dụng", "text": "Một đại biểu Quốc hội được triệu tập tham gia khoá bồi dưỡng kiến thức quốc phòng và an ninh. Theo Điều 2 Nghị định 13/2014/NĐ-CP, đại biểu này thuộc đối tượng nào và do ai quyết định triệu tập?", "options": ["Đối tượng 2, do Chủ tịch Hội đồng giáo dục quốc phòng và an ninh quân khu quyết định triệu tập", "Đối tượng 3, do Chủ tịch Hội đồng giáo dục quốc phòng và an ninh cấp tỉnh quyết định triệu tập", "Đối tượng 4, do Chủ tịch Hội đồng giáo dục quốc phòng và an ninh cấp xã quyết định triệu tập", "Đối tượng 1, do Chủ tịch Hội đồng giáo dục quốc phòng và an ninh trung ương quyết định triệu tập"], "answer": 3, "source": "Nghị định 13/2014/NĐ-CP (VBHN số 53/VBHN-BQP ngày 09/9/2025), Điều 2 khoản 1 điểm a.", "explanation": ""}, {"id": 28, "set": 5, "number": 28, "level": "Vận dụng", "text": "Học sinh K mắc bệnh mạn tính, gia đình muốn xin cho em được miễn học phần thực hành môn Giáo dục quốc phòng và an ninh. Theo Điều 10 Thông tư 22/2021/TT-BGDĐT, hồ sơ xin miễn gồm những gì?", "options": ["Bản cam kết tự học phần thực hành tại nhà và bản tự kiểm điểm có chữ kí của cha mẹ học sinh", "Đơn xin miễn học của học sinh và bệnh án hoặc giấy chứng nhận thương tật do bệnh viện cấp", "Đơn của cha mẹ học sinh có xác nhận của giáo viên chủ nhiệm và biên bản họp của tổ chuyên môn", "Giấy xác nhận của trạm y tế nơi cư trú và ý kiến đồng ý của Ban đại diện cha mẹ học sinh của lớp"], "answer": 1, "source": "Thông tư 22/2021/TT-BGDĐT, Điều 10 khoản 2.", "explanation": ""}, {"id": 29, "set": 5, "number": 29, "level": "Vận dụng", "text": "Căn cứ chương trình môn học, thầy H chủ động sắp xếp lại nội dung và phân phối thời lượng một số bài cho phù hợp với lớp mình dạy; một đồng nghiệp cho rằng giáo viên không có quyền này. Theo Luật Nhà giáo năm 2025, nhận định nào đúng?", "options": ["Thầy H làm sai, vì mọi thay đổi về thời lượng từng bài phải được Bộ Giáo dục và Đào tạo phê duyệt trước", "Thầy H làm sai, vì nhà giáo chỉ được dạy đúng thứ tự và số tiết của từng bài in trong sách giáo khoa", "Thầy H làm đúng, vì nhà giáo được tự thay đổi mục tiêu và yêu cầu cần đạt của chương trình môn học", "Thầy H làm đúng, vì nhà giáo được chủ động phân phối thời lượng, sắp xếp nội dung theo chương trình"], "answer": 3, "source": "Luật Nhà giáo số 73/2025/QH15, Điều 8 khoản 2 điểm a.", "explanation": ""}, {"id": 30, "set": 5, "number": 30, "level": "Vận dụng", "text": "Khi xây dựng kế hoạch dạy học lớp 11, tổ chuyên môn thắc mắc ai được chủ động sắp xếp thời lượng dành cho từng nội dung giáo dục. Theo Chương trình môn Giáo dục quốc phòng và an ninh cấp trung học phổ thông, câu trả lời là gì?", "options": ["Uỷ ban nhân dân cấp xã, căn cứ vào nhiệm vụ quốc phòng, an ninh hằng năm của địa phương", "Ban đại diện cha mẹ học sinh, căn cứ vào nguyện vọng của học sinh và điều kiện gia đình", "Bộ Quốc phòng, căn cứ vào kế hoạch huấn luyện hằng năm của lực lượng vũ trang địa phương", "Tác giả sách giáo khoa và giáo viên, căn cứ yêu cầu cần đạt và thực tế dạy học"], "answer": 3, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục VIII.2.2.", "explanation": ""}, {"id": 31, "set": 5, "number": 31, "level": "Vận dụng", "text": "Trên đường đi học về, Minh điều khiển xe đạp, vừa đi vừa nghe điện thoại và có lúc buông cả hai tay để chỉnh tai nghe. Theo quy định nêu trong sách giáo khoa lớp 10, nhận xét nào đúng?", "options": ["Minh không vi phạm, vì các quy định này chỉ áp dụng với người điều khiển xe mô tô và xe gắn máy", "Minh vi phạm quy định không sử dụng điện thoại di động và không buông cả hai tay khi điều khiển xe", "Minh chỉ vi phạm nếu gây ra tai nạn giao thông có thiệt hại về người hoặc tài sản cho người khác", "Minh không vi phạm, vì học sinh chưa đủ 16 tuổi không phải chịu trách nhiệm khi tham gia giao thông"], "answer": 1, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 4, mục “Đối với hoạt động giao thông đường bộ”.", "explanation": ""}, {"id": 32, "set": 5, "number": 32, "level": "Vận dụng", "text": "Bạn Tú dùng chung một mật khẩu đơn giản “123456” cho mọi tài khoản và không bật tính năng bảo vệ nào khác. Vận dụng các biện pháp bảo mật thông tin cá nhân trong sách giáo khoa lớp 10, lời khuyên nào phù hợp nhất?", "options": ["Giữ nguyên mật khẩu cho dễ nhớ nhưng hạn chế đăng nhập tài khoản vào buổi tối", "Chia sẻ mật khẩu cho bạn thân giữ hộ để phòng khi tài khoản bị người lạ chiếm đoạt", "Đặt mật khẩu có độ an toàn cao và kích hoạt tính năng xác thực nhiều bước", "Ghi mật khẩu lên trang cá nhân ở chế độ riêng tư để khi quên có thể xem lại"], "answer": 2, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 6, mục “Một số biện pháp bảo mật thông tin cá nhân”.", "explanation": ""}, {"id": 33, "set": 5, "number": 33, "level": "Vận dụng", "text": "Chị Lan, 18 tuổi, đã tốt nghiệp trung cấp y và có nguyện vọng phục vụ trong Quân đội. Theo Luật Nghĩa vụ quân sự, chị Lan có thuộc đối tượng đăng kí nghĩa vụ quân sự không?", "options": ["Không, vì pháp luật chỉ quy định việc đăng kí nghĩa vụ quân sự đối với công dân nam đủ 17 tuổi trở lên", "Không, vì công dân nữ chỉ được đăng kí nghĩa vụ quân sự khi đã tốt nghiệp đại học trở lên", "Có, vì mọi công dân nữ đủ 17 tuổi trở lên đều bắt buộc phải đăng kí nghĩa vụ quân sự lần đầu", "Có, vì công dân nữ đủ 18 tuổi trở lên, có ngành, nghề chuyên môn phù hợp thì được đăng kí"], "answer": 3, "source": "SGK GDQP-AN 11, bài “Luật Nghĩa vụ quân sự và trách nhiệm của học sinh” (nội dung 11), mục “Đăng kí nghĩa vụ quân sự”.", "explanation": ""}, {"id": 34, "set": 5, "number": 34, "level": "Vận dụng", "text": "Anh H nhận quyết định gọi sơ tuyển sức khoẻ thực hiện nghĩa vụ quân sự nhưng không có mặt đúng thời gian, địa điểm tập trung sơ tuyển mà không có lí do chính đáng. Theo Nghị định số 218/2025/NĐ-CP nêu trong sách giáo khoa lớp 11, anh H bị xử phạt ở mức nào?", "options": ["Phạt tiền từ 3 000 000 đồng đến 5 000 000 đồng", "Phạt tiền từ 8 000 000 đồng đến 10 000 000 đồng", "Phạt tiền từ 5 000 000 đồng đến 8 000 000 đồng", "Phạt tiền từ 20 000 000 đồng đến 30 000 000 đồng"], "answer": 0, "source": "SGK GDQP-AN 11, bài “Luật Nghĩa vụ quân sự và trách nhiệm của học sinh” (nội dung 11), mục “Xử lí vi phạm hành chính”.", "explanation": ""}, {"id": 35, "set": 5, "number": 35, "level": "Vận dụng", "text": "Giờ ra chơi, một bạn mang dao găm đến lớp để khoe với các bạn. Vận dụng trách nhiệm của học sinh trong thực hiện pháp luật về quản lí vũ khí, em nên xử sự như thế nào?", "options": ["Quay video đăng lên mạng xã hội để cảnh báo cho học sinh các trường khác cùng biết", "Giữ bí mật giúp bạn, vì đây là việc riêng và chưa gây ra hậu quả gì cho người khác", "Mượn xem rồi trả lại, vì dao găm không thuộc loại vũ khí được pháp luật quy định quản lí", "Tỏ thái độ không đồng tình, khuyên bạn không mang dao găm đến trường và báo thầy, cô giáo"], "answer": 3, "source": "SGK GDQP-AN 11, bài “Pháp luật về quản lí vũ khí, vật liệu nổ, công cụ hỗ trợ” (nội dung 10), mục “Một số khái niệm”, “Trách nhiệm của học sinh”.", "explanation": ""}, {"id": 36, "set": 5, "number": 36, "level": "Vận dụng", "text": "Trên mạng có ý kiến cho rằng cuộc chiến đấu bảo vệ biên giới phía Bắc năm 1979 là do Việt Nam “gây hấn”. Dựa vào sách giáo khoa lớp 12, lập luận nào phù hợp để phản bác?", "options": ["Việt Nam chủ động tiến công trước để ngăn ngừa nguy cơ chiến tranh có thể xảy ra ở biên giới phía Bắc", "Đây là cuộc xung đột do hai bên cùng chủ động gây ra nên không thể xác định được tính chất chính nghĩa", "Sự kiện này không được ghi trong sách giáo khoa nên học sinh không cần quan tâm và không cần phản bác", "Quân và dân ta thực hiện quyền tự vệ chính đáng, chính nghĩa, thể hiện khát vọng hoà bình"], "answer": 3, "source": "SGK GDQP-AN 12, bài “Bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa sau năm 1975” (nội dung 12), mục “Giá trị lịch sử” của cuộc chiến đấu bảo vệ biên giới phía Bắc.", "explanation": ""}, {"id": 37, "set": 5, "number": 37, "level": "Vận dụng cao", "text": "Một phương án phân bổ ngân sách nhà nước có các tỉ lệ so với tổng chi ngân sách nhà nước như sau: chi cho giáo dục, đào tạo 21%; trong đó chi đầu tư cho giáo dục 4,5% và chi cho giáo dục đại học 3,2%. Đối chiếu khoản 1 Điều 96 Luật Giáo dục (sửa đổi năm 2025), nhận định nào đúng?", "options": ["Đã đáp ứng, vì tổng chi cho giáo dục, đào tạo đạt 21%, cao hơn mức tối thiểu 20% theo quy định", "Chưa đáp ứng, vì tổng chi cho giáo dục, đào tạo không được phép vượt quá 20% tổng chi ngân sách", "Chưa đáp ứng, vì chi cho giáo dục đại học mới đạt 3,2%, thấp hơn mức ít nhất 5% theo quy định", "Chưa đáp ứng, vì chi đầu tư mới đạt 4,5%, thấp hơn mức ít nhất 5% tổng chi ngân sách nhà nước"], "answer": 3, "source": "Luật số 123/2025/QH15 sửa đổi, bổ sung Luật Giáo dục, Điều 1 khoản 31 (bổ sung khoản 1 Điều 96: tối thiểu 20%, trong đó chi đầu tư ít nhất 5% và chi giáo dục đại học ít nhất 3%).", "explanation": ""}, {"id": 38, "set": 5, "number": 38, "level": "Vận dụng cao", "text": "Xét ba văn bản: Nghị quyết số 71-NQ/TW của Bộ Chính trị, Nghị quyết số 248/2025/QH15 của Quốc hội và Nghị quyết số 281/NQ-CP của Chính phủ. Căn cứ ngày ban hành ghi trong các văn bản đã có, nhận định nào đúng?", "options": ["Thứ tự ban hành là 248/2025/QH15, 71-NQ/TW, 281/NQ-CP; Nghị quyết 71 được ban hành để hướng dẫn thi hành Nghị quyết 248 của Quốc hội", "Thứ tự ban hành: 71-NQ/TW, 281/NQ-CP, 248/2025/QH15; Nghị quyết 281 là chương trình hành động thực hiện Nghị quyết 71", "Ba nghị quyết được ban hành cùng ngày 10/12/2025 và đều có hiệu lực thi hành từ ngày 01/01/2026 trên phạm vi cả nước", "Thứ tự ban hành là 71-NQ/TW, 248/2025/QH15, 281/NQ-CP; Nghị quyết 281 là chương trình hành động thực hiện Nghị quyết 248 của Quốc hội"], "answer": 1, "source": "Nghị quyết số 281/NQ-CP ngày 15/9/2025 (tên văn bản, căn cứ ban hành); Nghị quyết số 248/2025/QH15, phần thể thức (thông qua ngày 10/12/2025).", "explanation": ""}, {"id": 39, "set": 5, "number": 39, "level": "Vận dụng cao", "text": "Ba công dân nam trong độ tuổi gọi nhập ngũ: X là con duy nhất của một thương binh hạng hai; Y đang học lớp 12; Z là con của bệnh binh suy giảm khả năng lao động 70%. Theo Luật Nghĩa vụ quân sự nêu trong sách giáo khoa lớp 11, kết luận nào đúng?", "options": ["X được miễn gọi nhập ngũ; Y và Z được tạm hoãn gọi nhập ngũ", "X và Z được miễn gọi nhập ngũ; Y được tạm hoãn gọi nhập ngũ", "X và Y được tạm hoãn gọi nhập ngũ; Z được miễn gọi nhập ngũ", "Cả ba công dân X, Y và Z đều được tạm hoãn gọi nhập ngũ"], "answer": 0, "source": "SGK GDQP-AN 11, bài “Luật Nghĩa vụ quân sự và trách nhiệm của học sinh” (nội dung 11), mục về tạm hoãn gọi nhập ngũ và miễn gọi nhập ngũ (một con của thương binh hạng hai: miễn; con của bệnh binh suy giảm từ 61% đến 80%, đang học phổ thông: tạm hoãn).", "explanation": ""}, {"id": 40, "set": 5, "number": 40, "level": "Vận dụng cao", "text": "Cho ba nhận định: (1) chiến lược “diễn biến hoà bình” được tiến hành chủ yếu bằng biện pháp phi quân sự; (2) bạo loạn lật đổ là hành động chống phá bằng bạo lực, có tổ chức; (3) bạo loạn lật đổ là mặt trận đi trước, chuẩn bị về tư tưởng, tổ chức, lực lượng cho “diễn biến hoà bình”. Kết luận nào đúng?", "options": ["Nhận định (1) và (3) đúng; nhận định (2) sai", "Nhận định (1) và (2) đúng; nhận định (3) sai", "Cả ba nhận định (1), (2) và (3) đều đúng", "Nhận định (2) và (3) đúng; nhận định (1) sai"], "answer": 1, "source": "SGK GDQP-AN 12, bài “Một số hiểu biết về chiến lược “diễn biến hoà bình”, bạo loạn lật đổ” (nội dung 15), mục “Khái niệm”, “Mối quan hệ giữa chiến lược “diễn biến hoà bình” và bạo loạn lật đổ” (“diễn biến hoà bình” mới là mặt trận xung kích, đi trước).", "explanation": ""}, {"id": 41, "set": 6, "number": 1, "level": "Nhận biết", "text": "Theo Điều 27 Luật Giáo dục quốc phòng và an ninh, ai xem xét, quyết định công nhận tuyên truyền viên giáo dục quốc phòng và an ninh?", "options": ["Hiệu trưởng trường trung học phổ thông", "Chủ tịch Uỷ ban nhân dân cấp tỉnh", "Chủ tịch Uỷ ban nhân dân cấp xã", "Bộ trưởng Bộ Quốc phòng"], "answer": 2, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 27.", "explanation": ""}, {"id": 42, "set": 6, "number": 2, "level": "Nhận biết", "text": "Thông tư số 22/2021/TT-BGDĐT quy định về đánh giá học sinh trung học cơ sở và học sinh trung học phổ thông được ban hành vào ngày, tháng, năm nào?", "options": ["Ngày 12/12/2011", "Ngày 20/7/2021", "Ngày 26/8/2020", "Ngày 05/9/2021"], "answer": 1, "source": "Thông tư 22/2021/TT-BGDĐT, phần đầu văn bản.", "explanation": ""}, {"id": 43, "set": 6, "number": 3, "level": "Nhận biết", "text": "Theo Chương trình môn Giáo dục quốc phòng và an ninh cấp trung học phổ thông, 35 tiết của lớp 11 (và của lớp 12) được phân bổ như thế nào?", "options": ["18 tiết lí thuyết, 17 tiết thực hành", "16 tiết lí thuyết, 19 tiết thực hành", "21 tiết lí thuyết, 14 tiết thực hành", "19 tiết lí thuyết, 16 tiết thực hành"], "answer": 3, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.2 (lớp 11, lớp 12).", "explanation": ""}, {"id": 44, "set": 6, "number": 4, "level": "Nhận biết", "text": "Theo Danh mục thiết bị dạy học tối thiểu môn Giáo dục quốc phòng và an ninh ban hành kèm theo Thông tư 19/2022/TT-BGDĐT, số lượng súng tiểu liên AK cấp 5 đã hoán cải, vô hiệu hoá là bao nhiêu?", "options": ["25 khẩu", "50 khẩu", "10 khẩu", "20 khẩu"], "answer": 0, "source": "Thông tư 19/2022/TT-BGDĐT, Danh mục thiết bị dạy học tối thiểu.", "explanation": ""}, {"id": 45, "set": 6, "number": 5, "level": "Nhận biết", "text": "Theo sách giáo khoa lớp 10, Luật Công an nhân dân năm 2018 gồm bao nhiêu chương, bao nhiêu điều?", "options": ["7 chương, 46 điều", "8 chương, 47 điều", "7 chương, 43 điều", "7 chương, 51 điều"], "answer": 0, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 2, mục “Luật Công an nhân dân”.", "explanation": ""}, {"id": 46, "set": 6, "number": 6, "level": "Nhận biết", "text": "Theo sách giáo khoa lớp 10, pháp luật về trật tự an toàn giao thông điều chỉnh các hoạt động giao thông trên những loại hình giao thông nào?", "options": ["Đường bộ, đường sắt, đường ống và đường cáp treo", "Đường bộ, đường sắt, đường thuỷ và đường hàng không", "Đường bộ, đường sắt đô thị, đường biển và đường hàng không", "Đường bộ, đường thuỷ, đường hàng không và đường ống"], "answer": 1, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 4, mục khái niệm.", "explanation": ""}, {"id": 47, "set": 6, "number": 7, "level": "Nhận biết", "text": "Theo Luật Nghĩa vụ quân sự, độ tuổi gọi nhập ngũ đối với công dân (không thuộc trường hợp đã được tạm hoãn để học cao đẳng, đại học) là bao nhiêu?", "options": ["Từ đủ 18 tuổi đến hết 27 tuổi", "Từ đủ 18 tuổi đến hết 25 tuổi", "Từ đủ 20 tuổi đến hết 30 tuổi", "Từ đủ 17 tuổi đến hết 25 tuổi"], "answer": 1, "source": "SGK GDQP-AN 11, bài “Luật Nghĩa vụ quân sự và trách nhiệm của học sinh” (nội dung 11), mục “Nhập ngũ”.", "explanation": ""}, {"id": 48, "set": 6, "number": 8, "level": "Nhận biết", "text": "Ngày 15/6/1978, Bộ Chính trị và Quân uỷ Trung ương đã có quyết định gì?", "options": ["Ra lệnh Tổng động viên trong cả nước để bảo vệ Tổ quốc", "Rút toàn bộ quân tình nguyện Việt Nam khỏi Campuchia", "Thành lập Mặt trận Đoàn kết dân tộc cứu nước Campuchia", "Phát động chiến tranh nhân dân, phản công địch"], "answer": 3, "source": "SGK GDQP-AN 12, bài “Bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa sau năm 1975” (nội dung 12), mục về chiến tranh bảo vệ biên giới Tây Nam.", "explanation": ""}, {"id": 49, "set": 6, "number": 9, "level": "Thông hiểu", "text": "Nguyên tắc nào sau đây được quy định tại khoản 4 Điều 5 Luật Giáo dục quốc phòng và an ninh?", "options": ["Giáo dục toàn diện, có trọng tâm; kết hợp lý luận với thực tiễn, lý thuyết với thực hành", "Giáo dục chủ yếu bằng thực hành ngoài thao trường; hạn chế tối đa việc dạy lý thuyết trên lớp", "Giáo dục thống nhất một nội dung, một hình thức cho mọi đối tượng trên phạm vi cả nước", "Giáo dục theo nguyện vọng của người học; nội dung do người học lựa chọn và tự đề xuất"], "answer": 0, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 5 khoản 4.", "explanation": ""}, {"id": 50, "set": 6, "number": 10, "level": "Thông hiểu", "text": "Theo Điều 12 Luật Giáo dục quốc phòng và an ninh, việc dạy và học giáo dục quốc phòng và an ninh trong trường cao đẳng nghề, cơ sở giáo dục đại học được tổ chức như thế nào?", "options": ["Là chương trình bồi dưỡng ngắn hạn, do Hội đồng giáo dục quốc phòng và an ninh cấp xã triệu tập", "Là môn học tự chọn, sinh viên đăng kí học tại đơn vị quân đội nơi đăng kí nghĩa vụ quân sự của mình", "Là môn học chính khoá, học tập trung tại trung tâm giáo dục quốc phòng và an ninh hoặc tại trường", "Là nội dung lồng ghép trong các môn lý luận chính trị, kết hợp với hoạt động ngoại khoá của đoàn thanh niên"], "answer": 2, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 12 khoản 1, khoản 3.", "explanation": ""}, {"id": 51, "set": 6, "number": 11, "level": "Thông hiểu", "text": "Theo Điều 16 Luật Giáo dục quốc phòng và an ninh, cá nhân tiêu biểu, người có uy tín trong cộng đồng dân cư thuộc diện bồi dưỡng kiến thức quốc phòng và an ninh gồm những ai?", "options": ["Giáo viên, giảng viên, báo cáo viên và tuyên truyền viên giáo dục quốc phòng và an ninh các cấp", "Chức sắc, chức việc tôn giáo, già làng, trưởng họ tộc, nhà hoạt động văn hoá, xã hội, khoa học", "Cán bộ, công chức, viên chức quản lý, đại biểu dân cử và người quản lý trong doanh nghiệp nhà nước", "Sĩ quan, quân nhân chuyên nghiệp, hạ sĩ quan, binh sĩ đã xuất ngũ trở về địa phương sinh sống"], "answer": 1, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 16 khoản 1.", "explanation": ""}, {"id": 52, "set": 6, "number": 12, "level": "Thông hiểu", "text": "Theo khoản 1 Điều 25 Luật Giáo dục quốc phòng và an ninh, trách nhiệm của giáo viên, giảng viên giáo dục quốc phòng và an ninh là gì?", "options": ["Quyết định công nhận tuyên truyền viên giáo dục quốc phòng và an ninh ở địa phương", "Giảng dạy đúng nội dung, chương trình quy định cho từng đối tượng", "Quy định chương trình khung giáo dục quốc phòng và an ninh cho các cấp học", "Lập dự toán và quyết toán ngân sách cho nhiệm vụ giáo dục quốc phòng và an ninh"], "answer": 1, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 25 khoản 1.", "explanation": ""}, {"id": 53, "set": 6, "number": 13, "level": "Thông hiểu", "text": "Theo phần đặc điểm môn học của Chương trình môn Giáo dục quốc phòng và an ninh cấp trung học phổ thông, môn học giữ vai trò gì?", "options": ["Vai trò chủ chốt trong giáo dục ý thức, trách nhiệm của công dân đối với nhiệm vụ xây dựng nền quốc phòng toàn dân", "Vai trò hỗ trợ cho môn Giáo dục thể chất trong việc rèn luyện thể lực và kĩ năng vận động cơ bản của học sinh", "Vai trò đào tạo học sinh thành hạ sĩ quan dự bị, sẵn sàng bổ sung cho lực lượng thường trực của Quân đội", "Vai trò thay thế việc thực hiện nghĩa vụ quân sự tại ngũ đối với học sinh sau khi tốt nghiệp trung học phổ thông"], "answer": 0, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục I.", "explanation": ""}, {"id": 54, "set": 6, "number": 14, "level": "Thông hiểu", "text": "Theo Chương trình môn Giáo dục quốc phòng và an ninh cấp trung học phổ thông, “phòng học chuyên dùng” được hiểu là gì?", "options": ["Phòng học bộ môn, được tích hợp dùng cho cả học lí thuyết và thực hành môn Giáo dục quốc phòng và an ninh", "Bãi rộng như sân trường, sân vận động, khu đất trống dùng để học tập và thục luyện các nội dung thực hành", "Phòng truyền thống của nhà trường, nơi trưng bày hiện vật, hình ảnh về lịch sử của địa phương và nhà trường", "Kho cất giữ vũ khí, trang bị kĩ thuật do cơ quan quân sự địa phương quản lí và cho nhà trường mượn sử dụng"], "answer": 0, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục VIII.1.1.", "explanation": ""}, {"id": 55, "set": 6, "number": 15, "level": "Thông hiểu", "text": "Theo Điều 7 Thông tư 22/2021/TT-BGDĐT, đánh giá định kì (giữa kì và cuối kì) được thực hiện thông qua những hình thức nào?", "options": ["Bài kiểm tra (trên giấy hoặc trên máy tính), bài thực hành, dự án học tập", "Quan sát trên lớp, kiểm tra bài cũ và học sinh tự đánh giá lẫn nhau", "Hỏi – đáp, thuyết trình, thí nghiệm và sản phẩm học tập hằng ngày", "Bài thi tốt nghiệp, bài thi học sinh giỏi và bài thi thử cuối cấp"], "answer": 0, "source": "Thông tư 22/2021/TT-BGDĐT, Điều 7 khoản 1.", "explanation": ""}, {"id": 56, "set": 6, "number": 16, "level": "Thông hiểu", "text": "Theo Điều 3 Luật Nhà giáo năm 2025, vị trí của nhà giáo được xác định như thế nào?", "options": ["Là người lao động làm việc theo hợp đồng thời vụ tại cơ sở giáo dục và được trả lương theo số tiết dạy", "Là công chức hành chính nhà nước, thực hiện nhiệm vụ quản lý nhà nước về giáo dục tại địa phương", "Là lực lượng hỗ trợ cho cán bộ quản lý giáo dục trong việc thực hiện chương trình và kế hoạch giáo dục", "Là lực lượng nòng cốt của ngành giáo dục, có vị thế quan trọng trong xã hội, được tôn trọng, tôn vinh"], "answer": 3, "source": "Luật Nhà giáo số 73/2025/QH15, Điều 3 khoản 1.", "explanation": ""}, {"id": 57, "set": 6, "number": 17, "level": "Thông hiểu", "text": "Nội dung nào sau đây thuộc truyền thống của lực lượng Dân quân tự vệ?", "options": ["Được Nhà nước phong quân hàm cấp Uý, cấp Tá, cấp Tướng trong quá trình công tác", "Là lực lượng nòng cốt trong bảo vệ an ninh Tổ quốc, đấu tranh phòng, chống tội phạm", "Hết lòng trung thành với Tổ quốc, với nhân dân, với sự nghiệp cách mạng của Đảng", "Là lực lượng nòng cốt, chuyên trách quản lí, bảo vệ biên giới quốc gia trên đất liền"], "answer": 2, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 1, mục “Truyền thống của Dân quân tự vệ”.", "explanation": ""}, {"id": 58, "set": 6, "number": 18, "level": "Thông hiểu", "text": "Theo Điều 26 Luật Sĩ quan Quân đội nhân dân Việt Nam (trích trong sách giáo khoa lớp 10), sĩ quan có nghĩa vụ gì?", "options": ["Sẵn sàng chiến đấu, hi sinh bảo vệ độc lập, chủ quyền, toàn vẹn lãnh thổ của Tổ quốc", "Trực tiếp quản lí hộ tịch, hộ khẩu và cấp thẻ căn cước cho công dân cư trú trên địa bàn đóng quân", "Thực hiện nhiệm vụ tuần tra, kiểm soát giao thông và xử lí vi phạm hành chính trên các tuyến đường", "Tham gia sản xuất tại địa phương, không thoát li công tác và chỉ làm nhiệm vụ khi có lệnh động viên"], "answer": 0, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 2, mục “Luật Sĩ quan Quân đội nhân dân Việt Nam” (trích Điều 26).", "explanation": ""}, {"id": 59, "set": 6, "number": 19, "level": "Thông hiểu", "text": "Theo sách giáo khoa lớp 10, quy tắc chung khi tham gia giao thông đường bộ là gì?", "options": ["Đi bên trái theo chiều đi của mình, được đi vào bất kì làn đường nào còn trống và ưu tiên phương tiện lớn hơn", "Đi theo hướng dẫn của người đi trước, không cần quan sát biển báo hiệu khi đã quen thuộc tuyến đường", "Đi ở giữa đường khi vắng xe, chỉ chấp hành tín hiệu đèn giao thông tại các nút giao có lực lượng chức năng", "Đi bên phải theo chiều đi của mình, đúng làn đường, phần đường quy định và chấp hành hệ thống báo hiệu"], "answer": 3, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 4, mục “Đối với hoạt động giao thông đường bộ”.", "explanation": ""}, {"id": 60, "set": 6, "number": 20, "level": "Thông hiểu", "text": "Theo nội dung Luật An ninh mạng nêu trong sách giáo khoa lớp 10, hành vi nào sau đây bị nghiêm cấm thực hiện trên không gian mạng?", "options": ["Chia sẻ những tấm gương người tốt, việc tốt và hình ảnh đẹp về đất nước, con người Việt Nam", "Xuyên tạc lịch sử, phủ nhận thành tựu cách mạng, phá hoại khối đại đoàn kết toàn dân tộc", "Cung cấp thông tin về hành vi xâm phạm an ninh mạng cho cơ quan có thẩm quyền", "Trao đổi học tập qua thư điện tử hoặc dịch vụ tin nhắn trên các nền tảng mạng xã hội"], "answer": 1, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 6, mục về các hành vi bị nghiêm cấm thực hiện trên không gian mạng.", "explanation": ""}, {"id": 61, "set": 6, "number": 21, "level": "Thông hiểu", "text": "Theo sách giáo khoa lớp 11, khu vực biên giới trên đất liền gồm những đơn vị hành chính nào?", "options": ["Các xã, phường giáp biển và các đảo, quần đảo, đặc khu của Việt Nam", "Xã, phường có một phần địa giới hành chính trùng hợp với biên giới quốc gia trên đất liền", "Toàn bộ các tỉnh, thành phố có đường biên giới quốc gia trên đất liền với các nước láng giềng", "Các xã, phường nằm trong phạm vi 10 km tính từ biên giới quốc gia trở vào"], "answer": 1, "source": "SGK GDQP-AN 11, bài “Bảo vệ chủ quyền lãnh thổ, biên giới quốc gia” (nội dung 7), mục “Khu vực biên giới”.", "explanation": ""}, {"id": 62, "set": 6, "number": 22, "level": "Thông hiểu", "text": "Theo pháp luật về quản lí vũ khí, vật liệu nổ, công cụ hỗ trợ nêu trong sách giáo khoa lớp 11, vũ khí gồm những loại nào?", "options": ["Vũ khí hạng nhẹ, vũ khí hạng nặng, vũ khí tự tạo, bom mìn", "Vũ khí quân dụng, vật liệu nổ, công cụ hỗ trợ, pháo nổ", "Vũ khí quân dụng, vũ khí thô sơ, vũ khí thể thao, súng săn", "Vũ khí thô sơ, thuốc nổ, phụ kiện nổ, động vật nghiệp vụ"], "answer": 2, "source": "SGK GDQP-AN 11, bài “Pháp luật về quản lí vũ khí, vật liệu nổ, công cụ hỗ trợ” (nội dung 10), mục “Một số khái niệm”.", "explanation": ""}, {"id": 63, "set": 6, "number": 23, "level": "Thông hiểu", "text": "Theo sách giáo khoa lớp 12, thủ đoạn của chiến lược “diễn biến hoà bình” trên lĩnh vực chính trị là gì?", "options": ["Lợi dụng đầu tư, liên doanh, liên kết, tài trợ để từng bước làm chệch hướng nền kinh tế thị trường định hướng xã hội chủ nghĩa", "Du nhập lối sống, đạo đức, văn hoá tư sản; tạo cho thế hệ trẻ lối sống ăn chơi, thực dụng, vụ lợi, vị kỉ, đua đòi, hưởng lạc", "Tuyên truyền, phát triển các tôn giáo trái pháp luật; kích động chức sắc, tín đồ và mua chuộc, lôi kéo đồng bào các dân tộc", "Từng bước xoá bỏ vai trò lãnh đạo của Đảng Cộng sản Việt Nam, tiến tới thực hiện “đa nguyên chính trị”, “đa đảng đối lập”"], "answer": 3, "source": "SGK GDQP-AN 12, bài “Một số hiểu biết về chiến lược “diễn biến hoà bình”, bạo loạn lật đổ” (nội dung 15), mục “Âm mưu, thủ đoạn thực hiện chiến lược “diễn biến hoà bình””.", "explanation": ""}, {"id": 64, "set": 6, "number": 24, "level": "Thông hiểu", "text": "Theo sách giáo khoa lớp 12, bộ đội địa phương được hiểu như thế nào?", "options": ["Là các binh đoàn chủ lực cơ động chiến lược do Bộ Quốc phòng trực tiếp chỉ huy, tác chiến trên phạm vi cả nước", "Là lực lượng vũ trang quần chúng không thoát li sản xuất, công tác, được tổ chức ở địa phương và ở cơ quan, tổ chức", "Là một thành phần của Quân đội nhân dân Việt Nam, tổ chức ở cấp tỉnh, cấp xã, do cơ quan quân sự địa phương chỉ huy", "Là lực lượng gồm quân nhân dự bị và phương tiện kĩ thuật dự bị được đăng kí, quản lí, sắp xếp vào đơn vị dự bị động viên"], "answer": 2, "source": "SGK GDQP-AN 12, bài “Truyền thống và nghệ thuật đánh giặc giữ nước của địa phương” (nội dung 16), mục “Thành phần của lực lượng vũ trang địa phương”.", "explanation": ""}, {"id": 65, "set": 6, "number": 25, "level": "Vận dụng", "text": "Công nhân của một doanh nghiệp tư nhân không thuộc diện bồi dưỡng kiến thức quốc phòng và an ninh hỏi họ có được tiếp cận kiến thức quốc phòng và an ninh không. Theo Điều 22 Luật Giáo dục quốc phòng và an ninh, câu trả lời nào đúng?", "options": ["Không, vì doanh nghiệp tư nhân không thuộc đối tượng áp dụng của Luật Giáo dục quốc phòng và an ninh", "Không, vì chỉ cán bộ, công chức, viên chức nhà nước mới được tiếp cận kiến thức quốc phòng và an ninh", "Có, người lao động trong doanh nghiệp, đơn vị sự nghiệp được phổ biến kiến thức quốc phòng và an ninh", "Có, nhưng người lao động phải tự đăng kí và tự chi trả học phí tại trung tâm giáo dục quốc phòng"], "answer": 2, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 22 khoản 1.", "explanation": ""}, {"id": 66, "set": 6, "number": 26, "level": "Vận dụng", "text": "Hội Cựu chiến binh xã muốn tặng trường trung học phổ thông một số mô hình, học cụ tự làm và một khoản tiền để phục vụ dạy học môn Giáo dục quốc phòng và an ninh. Theo Điều 6 Luật Giáo dục quốc phòng và an ninh, việc này được nhìn nhận như thế nào?", "options": ["Không được phép, vì nhà trường không được tiếp nhận tài sản của tổ chức chính trị – xã hội ở địa phương dưới mọi hình thức", "Không được phép, vì kinh phí và thiết bị cho giáo dục quốc phòng và an ninh chỉ do ngân sách nhà nước bảo đảm, không nhận đóng góp", "Được Nhà nước khuyến khích, tạo điều kiện; tổ chức, cá nhân được đóng góp công sức, tiền, tài sản cho hoạt động này", "Chỉ được phép khi có văn bản đồng ý của Bộ Quốc phòng đối với từng mô hình, học cụ và từng khoản tiền đóng góp cụ thể"], "answer": 2, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 6 khoản 2.", "explanation": ""}, {"id": 67, "set": 6, "number": 27, "level": "Vận dụng", "text": "Một học sinh khuyết tật học hoà nhập không có khả năng đáp ứng yêu cầu của một số nội dung thực hành môn Giáo dục quốc phòng và an ninh. Theo Điều 11 Thông tư 22/2021/TT-BGDĐT, việc đánh giá những nội dung này thực hiện như thế nào?", "options": ["Không đánh giá kết quả học tập của học sinh ở tất cả các môn học trong cả năm học", "Đánh giá theo Kế hoạch giáo dục cá nhân; không kiểm tra, đánh giá những nội dung môn học được miễn", "Cho điểm 0 đối với các nội dung học sinh không thực hiện được rồi tính điểm trung bình như bình thường", "Đánh giá như học sinh bình thường để bảo đảm công bằng giữa các học sinh trong cùng một lớp"], "answer": 1, "source": "Thông tư 22/2021/TT-BGDĐT, Điều 11 khoản 2.", "explanation": ""}, {"id": 68, "set": 6, "number": 28, "level": "Vận dụng", "text": "Để cập nhật kiến thức về tình hình quốc phòng, an ninh phục vụ bài dạy, cô giáo định lấy tư liệu từ một trang mạng không rõ nguồn gốc. Theo định hướng phương pháp của Chương trình môn Giáo dục quốc phòng và an ninh cấp trung học phổ thông, cô nên khai thác từ nguồn nào?", "options": ["Bất kì trang mạng nào có nội dung hấp dẫn, thu hút được học sinh", "Các trang tin nước ngoài chưa được kiểm chứng nhưng cập nhật nhanh", "Các diễn đàn, hội nhóm mạng xã hội có nhiều lượt theo dõi và chia sẻ", "Các cổng thông tin điện tử chính thức được cấp phép"], "answer": 3, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục VI.1.2.", "explanation": ""}, {"id": 69, "set": 6, "number": 29, "level": "Vận dụng", "text": "Hiệu trưởng một trường trung học phổ thông tư thục cho rằng chuẩn nghề nghiệp nhà giáo chỉ áp dụng cho giáo viên trường công lập. Theo Điều 13 Luật Nhà giáo năm 2025, nhận định nào đúng?", "options": ["Đúng, vì trường tư thục được tự ban hành chuẩn nghề nghiệp riêng, thay thế chuẩn do Nhà nước quy định", "Sai, vì chuẩn nghề nghiệp nhà giáo được áp dụng thống nhất cho cả cơ sở giáo dục công lập và ngoài công lập", "Sai, vì chuẩn nghề nghiệp nhà giáo chỉ áp dụng đối với các cơ sở giáo dục ngoài công lập", "Đúng, vì nhà giáo trường tư thục làm việc theo hợp đồng lao động nên không thuộc phạm vi áp dụng chuẩn nghề nghiệp"], "answer": 1, "source": "Luật Nhà giáo số 73/2025/QH15, Điều 13 khoản 2.", "explanation": ""}, {"id": 70, "set": 6, "number": 30, "level": "Vận dụng", "text": "Tỉnh M cần điều động một giáo viên giữa hai trường công lập thuộc hai xã khác nhau trong tỉnh. Theo Nghị quyết số 248/2025/QH15, ai có thẩm quyền thực hiện việc điều động này?", "options": ["Hiệu trưởng trường nơi giáo viên chuyển đến, vì nhà trường là đơn vị trực tiếp sử dụng giáo viên", "Chủ tịch Uỷ ban nhân dân cấp xã nơi giáo viên đang công tác, vì xã trực tiếp quản lý giáo viên của trường", "Giám đốc Sở Giáo dục và Đào tạo, vì việc điều động liên quan đến từ 02 đơn vị hành chính cấp xã trở lên", "Bộ trưởng Bộ Giáo dục và Đào tạo, vì việc điều động giáo viên vượt ra ngoài phạm vi một cơ sở giáo dục"], "answer": 2, "source": "Nghị quyết số 248/2025/QH15, Điều 2 khoản 1 điểm a, điểm b.", "explanation": ""}, {"id": 71, "set": 6, "number": 31, "level": "Vận dụng", "text": "Trong giờ học, một bạn khẳng định: “Công an nhân dân ra đời trước Quân đội nhân dân Việt Nam”. Dựa vào kiến thức sách giáo khoa lớp 10, em nhận xét như thế nào?", "options": ["Đúng, vì Công an nhân dân thành lập ngày 19/8/1945, còn Quân đội nhân dân Việt Nam thành lập ngày 19/12/1946", "Sai, vì Quân đội ta thành lập ngày 22/12/1944, còn Công an nhân dân thành lập ngày 19/8/1945", "Đúng, vì Công an nhân dân được hình thành từ các đội tự vệ ra đời theo nghị quyết ngày 28/3/1935", "Sai, vì hai lực lượng được thành lập cùng một ngày trong Cách mạng tháng Tám năm 1945"], "answer": 1, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 1, mục lịch sử Quân đội nhân dân và Công an nhân dân.", "explanation": ""}, {"id": 72, "set": 6, "number": 32, "level": "Vận dụng", "text": "Em muốn tuyên truyền cho ông bà về việc đội mũ bảo hiểm khi ngồi trên xe máy. Theo hướng dẫn trong sách giáo khoa lớp 10, trước khi thực hiện em cần làm gì?", "options": ["Chờ đến khi ông bà vi phạm và bị xử phạt rồi mới tiến hành tuyên truyền", "Nhờ lực lượng cảnh sát giao thông đến nhà để tuyên truyền thay cho mình", "Chỉ cần chép lại toàn bộ các điều luật về giao thông rồi đọc cho ông bà nghe", "Xác định đối tượng, lựa chọn nội dung và hình thức tuyên truyền phù hợp"], "answer": 3, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 4, phần “Em có biết?” về tuyên truyền phòng ngừa vi phạm pháp luật về trật tự an toàn giao thông.", "explanation": ""}, {"id": 73, "set": 6, "number": 33, "level": "Vận dụng", "text": "Một hộ dân ở xã biên giới rủ người thân sang phía bên kia đường biên phát nương làm rẫy vì đất ở đó tốt hơn. Theo Luật Biên giới quốc gia nêu trong sách giáo khoa lớp 11, nhận định nào đúng?", "options": ["Được phép nếu chỉ canh tác theo mùa vụ và không dựng nhà ở bên kia biên giới", "Chỉ bị cấm nếu việc canh tác làm hư hại hoặc xê dịch mốc quốc giới", "Đây là hành vi xâm canh ở khu vực biên giới, thuộc các hành vi bị nghiêm cấm", "Được phép, vì cư dân biên giới có quyền tự do canh tác ở cả hai bên đường biên"], "answer": 2, "source": "SGK GDQP-AN 11, bài “Bảo vệ chủ quyền lãnh thổ, biên giới quốc gia” (nội dung 7), mục “Các hành vi bị nghiêm cấm”.", "explanation": ""}, {"id": 74, "set": 6, "number": 34, "level": "Vận dụng", "text": "Anh T là binh sĩ đã phục vụ tại ngũ gần đủ 24 tháng thì đơn vị được giao nhiệm vụ phòng, chống thiên tai. Có ý kiến cho rằng đơn vị có thể giữ anh lại thêm 10 tháng. Theo Luật Nghĩa vụ quân sự, nhận định nào đúng?", "options": ["Sai, vì Bộ trưởng Bộ Quốc phòng chỉ được quyết định kéo dài thời hạn tại ngũ không quá 06 tháng", "Sai, vì trong thời bình không được kéo dài thời hạn phục vụ tại ngũ trong bất kì trường hợp nào", "Đúng, vì chỉ huy đơn vị được kéo dài thời hạn phục vụ tại ngũ của binh sĩ tối đa 12 tháng", "Đúng, vì khi làm nhiệm vụ phòng, chống thiên tai thì thời hạn phục vụ tại ngũ không bị giới hạn"], "answer": 0, "source": "SGK GDQP-AN 11, bài “Luật Nghĩa vụ quân sự và trách nhiệm của học sinh” (nội dung 11), mục “Thời hạn phục vụ tại ngũ”.", "explanation": ""}, {"id": 75, "set": 6, "number": 35, "level": "Vận dụng", "text": "Một bạn cùng lớp rủ em nạp tiền chơi “tài xỉu” trên một ứng dụng trực tuyến và nói rằng “chơi trên mạng thì không ai biết”. Dựa vào sách giáo khoa lớp 11, nhận định nào đúng?", "options": ["Được phép tham gia nếu số tiền nạp mỗi lần nhỏ và người chơi đã đủ 16 tuổi", "Chỉ người tổ chức ứng dụng vi phạm pháp luật, người tham gia chơi không bị xử lí", "Đánh bạc trên không gian mạng là hành vi phạm tội sử dụng công nghệ cao; cần từ chối", "Chỉ đánh bạc trực tiếp bằng tiền mặt mới vi phạm pháp luật, còn chơi trên mạng là giải trí"], "answer": 2, "source": "SGK GDQP-AN 11, bài “Phòng chống tệ nạn xã hội ở Việt Nam trong thời kì hội nhập quốc tế” (nội dung 8), mục “Một số hành vi phạm tội sử dụng công nghệ cao ở Việt Nam hiện nay”.", "explanation": ""}, {"id": 76, "set": 6, "number": 36, "level": "Vận dụng", "text": "Nhóm em thực hiện dự án tìm hiểu truyền thống của lực lượng vũ trang địa phương. Theo sách giáo khoa lớp 12, đề cương nào bám sát những nội dung cần tập trung?", "options": ["Ngày truyền thống, quá trình xây dựng, chiến đấu; chiến công, danh hiệu; người có công; đóng góp trong thời bình", "Các trò chơi quân sự trên mạng; phim hành động nổi tiếng; trang phục và phụ kiện theo phong cách quân đội đang thịnh hành", "Tiểu sử chi tiết của các chỉ huy quân sự nước ngoài; cấu tạo các loại vũ khí hiện đại; bảng xếp hạng sức mạnh quân sự thế giới", "Danh sách cán bộ đương nhiệm của xã, phường; kế hoạch phát triển kinh tế; các dự án đầu tư đang triển khai trên địa bàn"], "answer": 0, "source": "SGK GDQP-AN 12, bài “Truyền thống và nghệ thuật đánh giặc giữ nước của địa phương” (nội dung 16), mục “Tìm hiểu truyền thống của lực lượng vũ trang địa phương nơi học sinh đang sinh sống”.", "explanation": ""}, {"id": 77, "set": 6, "number": 37, "level": "Vận dụng cao", "text": "Chủ tịch Hội đồng giáo dục quốc phòng và an ninh xã P kí quyết định triệu tập hai nhóm học viên: (a) trưởng thôn và đảng viên trong các cơ quan, tổ chức trên địa bàn xã; (b) đại biểu Hội đồng nhân dân xã. Đối chiếu Điều 2 Nghị định 13/2014/NĐ-CP (văn bản hợp nhất năm 2025), nhận định nào đúng?", "options": ["Triệu tập nhóm (b) đúng thẩm quyền; nhóm (a) thuộc thẩm quyền của Chủ tịch Hội đồng cấp quân khu", "Triệu tập cả hai nhóm đều sai thẩm quyền, vì mọi đối tượng bồi dưỡng đều do Hội đồng cấp tỉnh triệu tập", "Triệu tập cả hai nhóm đều đúng thẩm quyền, vì các học viên đều cư trú và công tác trên địa bàn xã P quản lý", "Nhóm (a) đúng thẩm quyền; nhóm (b) thuộc thẩm quyền của Chủ tịch Hội đồng cấp tỉnh"], "answer": 3, "source": "Nghị định 13/2014/NĐ-CP (VBHN số 53/VBHN-BQP ngày 09/9/2025), Điều 2 khoản 1 điểm c, điểm đ.", "explanation": ""}, {"id": 78, "set": 6, "number": 38, "level": "Vận dụng cao", "text": "Cho ba nhận định về giáo dục quốc phòng và an ninh trong nhà trường: (1) ở trường trung học phổ thông và ở cơ sở giáo dục đại học, đây đều là môn học chính khoá; (2) sinh viên đại học chỉ được học môn này tập trung tại trung tâm giáo dục quốc phòng và an ninh; (3) trường của tổ chức chính trị xây dựng chương trình căn cứ chương trình khung của Bộ Quốc phòng. Kết luận nào đúng?", "options": ["Cả ba nhận định (1), (2) và (3) đều đúng", "Nhận định (1) và (2) đúng; nhận định (3) sai", "Nhận định (2) và (3) đúng; nhận định (1) sai", "Nhận định (1) và (3) đúng; nhận định (2) sai"], "answer": 3, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 11 khoản 1, Điều 12 khoản 1, khoản 3, Điều 13 khoản 3 (học tập trung tại trung tâm hoặc tại trường).", "explanation": ""}, {"id": 79, "set": 6, "number": 39, "level": "Vận dụng cao", "text": "Công an xã Q lập kế hoạch tuyển chọn công dân thực hiện nghĩa vụ tham gia Công an nhân dân: (1) tiếp nhận hồ sơ đăng kí dự tuyển trong 20 ngày kể từ ngày thông báo; (2) quyết định gọi khám sức khoẻ được giao cho công dân trước thời điểm khám 15 ngày; (3) Chủ tịch Uỷ ban nhân dân xã quyết định danh sách công dân được tuyển chọn. Đối chiếu Nghị định 70/2019/NĐ-CP nêu trong sách giáo khoa lớp 11, nội dung nào chưa đúng?", "options": ["Nội dung (1) và (2): thời hạn nhận hồ sơ ít nhất 45 ngày; quyết định khám sức khoẻ phải giao trước 07 ngày", "Nội dung (2) và (3): quyết định khám sức khoẻ phải giao trước 30 ngày; danh sách do Giám đốc Công an tỉnh quyết định", "Chỉ nội dung (3): danh sách công dân được tuyển chọn do Bộ trưởng Bộ Công an trực tiếp quyết định", "Nội dung (1) và (3): thời hạn nhận hồ sơ ít nhất 30 ngày; danh sách do Chủ tịch Uỷ ban nhân dân cấp tỉnh quyết định"], "answer": 3, "source": "SGK GDQP-AN 11, bài “Luật Nghĩa vụ quân sự và trách nhiệm của học sinh” (nội dung 11), mục “Hồ sơ, trình tự tuyển chọn thực hiện nghĩa vụ tham gia Công an nhân dân”.", "explanation": ""}, {"id": 80, "set": 6, "number": 40, "level": "Vận dụng cao", "text": "Cho ba nét nghệ thuật: (a) liên minh chiến đấu giữa quân tình nguyện Việt Nam với lực lượng cách mạng nước bạn; (b) quán triệt tư tưởng “lấy nhỏ đánh lớn, lấy ít địch nhiều”, đánh giặc ngay từ đầu, trên tuyến đầu của Tổ quốc; (c) kiên định giải quyết bất đồng, tranh chấp bằng biện pháp hoà bình trên cơ sở luật pháp quốc tế. Theo sách giáo khoa lớp 12, các nét này lần lượt gắn với sự kiện nào?", "options": ["(a) chiến tranh bảo vệ biên giới Tây Nam; (b) chiến đấu bảo vệ biên giới phía Bắc; (c) đấu tranh bảo vệ chủ quyền biển, đảo", "(a) chiến đấu bảo vệ biên giới phía Bắc; (b) chiến tranh bảo vệ biên giới Tây Nam; (c) đấu tranh bảo vệ chủ quyền biển, đảo", "(a) chiến tranh bảo vệ biên giới Tây Nam; (b) đấu tranh bảo vệ chủ quyền biển, đảo; (c) chiến đấu bảo vệ biên giới phía Bắc", "(a) đấu tranh bảo vệ chủ quyền biển, đảo; (b) chiến đấu bảo vệ biên giới phía Bắc; (c) chiến tranh bảo vệ biên giới Tây Nam"], "answer": 0, "source": "SGK GDQP-AN 12, bài “Bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa sau năm 1975” (nội dung 12), các mục về nghệ thuật quân sự, nghệ thuật đấu tranh.", "explanation": ""}, {"id": 81, "set": 7, "number": 1, "level": "Nhận biết", "text": "Theo Điều 36 Luật Giáo dục quốc phòng và an ninh, cơ quan nào quyết định thành lập trung tâm giáo dục quốc phòng và an ninh thuộc cơ sở giáo dục đại học?", "options": ["Bộ Công an", "Bộ Quốc phòng", "Uỷ ban nhân dân cấp tỉnh", "Bộ Giáo dục và Đào tạo"], "answer": 3, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 36 khoản 7.", "explanation": ""}, {"id": 82, "set": 7, "number": 2, "level": "Nhận biết", "text": "Luật Giáo dục số 43/2019/QH14 có hiệu lực thi hành từ ngày nào?", "options": ["Ngày 01/01/2020", "Ngày 01/7/2020", "Ngày 01/01/2026", "Ngày 14/6/2019"], "answer": 1, "source": "Luật Giáo dục số 43/2019/QH14, điều khoản về hiệu lực thi hành.", "explanation": ""}, {"id": 83, "set": 7, "number": 3, "level": "Nhận biết", "text": "Thông tư số 46/2020/TT-BGDĐT ban hành Chương trình môn Giáo dục quốc phòng và an ninh cấp trung học phổ thông có hiệu lực thi hành kể từ ngày nào?", "options": ["Ngày 24/11/2020", "Ngày 13/01/2017", "Ngày 11/01/2021", "Ngày 05/9/2021"], "answer": 2, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, Điều 3 của Thông tư.", "explanation": ""}, {"id": 84, "set": 7, "number": 4, "level": "Nhận biết", "text": "Theo Luật Giáo dục (sửa đổi năm 2025), giáo dục trung học phổ thông được thực hiện trong bao nhiêu năm học?", "options": ["03 năm học, từ lớp mười đến hết lớp mười hai", "04 năm học, từ lớp chín đến hết lớp mười hai", "03 năm học, từ lớp chín đến hết lớp mười một", "02 năm học, từ lớp mười một đến hết lớp mười hai"], "answer": 0, "source": "Luật số 123/2025/QH15 sửa đổi, bổ sung Luật Giáo dục, Điều 1 khoản 7 (sửa đổi Điều 28 Luật Giáo dục).", "explanation": ""}, {"id": 85, "set": 7, "number": 5, "level": "Nhận biết", "text": "Chủ tịch Hồ Chí Minh ra Lời kêu gọi Toàn quốc kháng chiến vào ngày nào?", "options": ["Ngày 19/8/1945", "Ngày 19/12/1946", "Ngày 22/12/1944", "Ngày 28/3/1935"], "answer": 1, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 1, mục “Lịch sử Dân quân tự vệ”.", "explanation": ""}, {"id": 86, "set": 7, "number": 6, "level": "Nhận biết", "text": "Theo sách giáo khoa lớp 10, Luật An ninh mạng năm 2018 gồm bao nhiêu chương, bao nhiêu điều?", "options": ["7 chương, 55 điều", "8 chương, 75 điều", "7 chương, 46 điều", "7 chương, 43 điều"], "answer": 3, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 6, mục “Nội dung cơ bản của Luật An ninh mạng”.", "explanation": ""}, {"id": 87, "set": 7, "number": 7, "level": "Nhận biết", "text": "Theo Luật Biển Việt Nam, lãnh hải là vùng biển có chiều rộng bao nhiêu hải lí tính từ đường cơ sở ra phía biển?", "options": ["24 hải lí", "12 hải lí", "350 hải lí", "200 hải lí"], "answer": 1, "source": "SGK GDQP-AN 11, bài “Bảo vệ chủ quyền lãnh thổ, biên giới quốc gia” (nội dung 7), mục về các vùng biển Việt Nam.", "explanation": ""}, {"id": 88, "set": 7, "number": 8, "level": "Nhận biết", "text": "Trong cuộc chiến đấu bảo vệ biên giới phía Bắc, đến ngày nào về cơ bản Trung Quốc đã rút quân khỏi nước ta?", "options": ["Ngày 5/3/1979", "Ngày 17/2/1979", "Ngày 18/3/1979", "Ngày 7/1/1979"], "answer": 2, "source": "SGK GDQP-AN 12, bài “Bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa sau năm 1975” (nội dung 12), mục về cuộc chiến đấu bảo vệ biên giới phía Bắc.", "explanation": ""}, {"id": 89, "set": 7, "number": 9, "level": "Thông hiểu", "text": "Nguyên tắc nào sau đây được quy định tại khoản 6 Điều 5 Luật Giáo dục quốc phòng và an ninh?", "options": ["Bảo đảm nội dung chuyên sâu về kĩ thuật quân sự hiện đại, không cần chú ý tới tính dễ hiểu đối với người học", "Bảo đảm công khai toàn bộ tài liệu, kế hoạch quốc phòng, an ninh cho mọi người học trong và ngoài nước tiếp cận", "Bảo đảm chương trình không thay đổi trong suốt quá trình thực hiện để giữ tính ổn định lâu dài của nội dung", "Bảo đảm bí mật nhà nước, tính kế hoạch, kế thừa, phát triển, khoa học, hiện đại, dễ hiểu, thiết thực và hiệu quả"], "answer": 3, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 5 khoản 6.", "explanation": ""}, {"id": 90, "set": 7, "number": 10, "level": "Thông hiểu", "text": "Theo Điều 15 Luật Giáo dục quốc phòng và an ninh, người quản lý doanh nghiệp ngoài khu vực nhà nước nào phải tham gia bồi dưỡng kiến thức quốc phòng và an ninh?", "options": ["Chỉ các doanh nghiệp siêu nhỏ, hộ kinh doanh cá thể hoạt động tại các thành phố trực thuộc trung ương", "Mọi doanh nghiệp ngoài khu vực nhà nước, không phân biệt quy mô, lĩnh vực hoạt động và địa bàn đặt trụ sở", "Doanh nghiệp quy mô vừa trở lên; phục vụ quốc phòng, an ninh; hoạt động ở vùng sâu, vùng xa, biên giới, hải đảo", "Chỉ các doanh nghiệp có vốn đầu tư nước ngoài và doanh nghiệp do người nước ngoài trực tiếp quản lý, điều hành"], "answer": 2, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 15 khoản 1.", "explanation": ""}, {"id": 91, "set": 7, "number": 11, "level": "Thông hiểu", "text": "Theo Điều 19 Luật Giáo dục quốc phòng và an ninh, nội dung phổ biến kiến thức quốc phòng và an ninh cho toàn dân gồm những hiểu biết cần thiết về vấn đề gì?", "options": ["Quy trình lập dự toán, chấp hành và quyết toán ngân sách nhà nước cho nhiệm vụ giáo dục quốc phòng và an ninh", "Độc lập, chủ quyền, toàn vẹn lãnh thổ; âm mưu, thủ đoạn của các thế lực thù địch; nhiệm vụ quốc phòng và an ninh", "Chương trình khung đào tạo giáo viên, giảng viên giáo dục quốc phòng và an ninh trình độ đại học và sau đại học", "Kĩ thuật bắn súng tiểu liên AK, kĩ thuật sử dụng lựu đạn, chiến thuật từng người trong chiến đấu tiến công và phòng ngự"], "answer": 1, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 19.", "explanation": ""}, {"id": 92, "set": 7, "number": 12, "level": "Thông hiểu", "text": "Theo Điều 34 Luật Giáo dục quốc phòng và an ninh, cơ quan nào bảo đảm vũ khí, trang bị kỹ thuật, thiết bị dạy học quân dụng chuyên dùng phục vụ dạy và học môn giáo dục quốc phòng và an ninh cho cơ sở giáo dục trong phạm vi cả nước?", "options": ["Bộ Quốc phòng", "Bộ Tài chính", "Bộ Giáo dục và Đào tạo", "Bộ Công an"], "answer": 0, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 34 khoản 6.", "explanation": ""}, {"id": 93, "set": 7, "number": 13, "level": "Thông hiểu", "text": "Quan điểm “tính kế thừa và hiện đại” trong xây dựng Chương trình môn Giáo dục quốc phòng và an ninh cấp trung học phổ thông thể hiện ở điểm nào?", "options": ["Dựa trên truyền thống, kinh nghiệm đánh giặc giữ nước, nghệ thuật quân sự Việt Nam và cập nhật thành tựu khoa học quân sự hiện đại", "Dành toàn bộ thời lượng để học sinh tìm hiểu vũ khí công nghệ cao, không dạy các nội dung về lịch sử, truyền thống", "Giữ nguyên toàn bộ nội dung của chương trình ban hành năm 2017, chỉ thay đổi tên gọi của các bài học cho phù hợp với sách giáo khoa mới", "Chỉ sử dụng tài liệu, giáo trình quân sự của nước ngoài để bảo đảm tính hiện đại, không đưa nội dung truyền thống vào chương trình"], "answer": 0, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục II.1.", "explanation": ""}, {"id": 94, "set": 7, "number": 14, "level": "Thông hiểu", "text": "Theo mục tiêu của Chương trình môn Giáo dục quốc phòng và an ninh cấp trung học phổ thông, môn học góp phần phát triển ở học sinh các năng lực chung nào?", "options": ["Năng lực thẩm mĩ; năng lực thể chất; năng lực công nghệ", "Năng lực khoa học; năng lực ngoại ngữ; năng lực lãnh đạo", "Tự chủ, tự học; hợp tác; giải quyết vấn đề sáng tạo", "Năng lực ngôn ngữ; năng lực tính toán; năng lực tin học"], "answer": 2, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục III.", "explanation": ""}, {"id": 95, "set": 7, "number": 15, "level": "Thông hiểu", "text": "Theo Điều 5 Thông tư 22/2021/TT-BGDĐT, khi đánh giá bằng nhận xét, giáo viên thực hiện như thế nào?", "options": ["Giao cho ban cán sự lớp nhận xét thay và giáo viên không cần theo dõi quá trình rèn luyện của học sinh", "Dùng hình thức nói hoặc viết để nhận xét sự tiến bộ, ưu điểm nổi bật, hạn chế chủ yếu của học sinh", "Chỉ dùng điểm số theo thang điểm 10 để ghi nhận kết quả, không ghi lời nhận xét vào sổ theo dõi và đánh giá học sinh", "Chỉ nhận xét về những hạn chế, khuyết điểm của học sinh để học sinh rút kinh nghiệm trong học kì tiếp theo"], "answer": 1, "source": "Thông tư 22/2021/TT-BGDĐT, Điều 5 khoản 1 điểm a.", "explanation": ""}, {"id": 96, "set": 7, "number": 16, "level": "Thông hiểu", "text": "Nội dung nào sau đây là nghĩa vụ của nhà giáo theo khoản 2 Điều 9 Luật Nhà giáo năm 2025?", "options": ["Được nghỉ hè và các ngày nghỉ khác theo quy định của pháp luật về lao động", "Được tôn trọng, bảo vệ uy tín, danh dự, nhân phẩm trong hoạt động nghề nghiệp", "Được xếp lương cao nhất trong hệ thống thang bậc lương hành chính sự nghiệp", "Giữ gìn phẩm chất, uy tín, đạo đức nhà giáo; mẫu mực, nêu gương"], "answer": 3, "source": "Luật Nhà giáo số 73/2025/QH15, Điều 9 khoản 2 điểm b (so sánh với Điều 8, Điều 23).", "explanation": ""}, {"id": 97, "set": 7, "number": 17, "level": "Thông hiểu", "text": "Theo sách giáo khoa lớp 10, trong kháng chiến chống thực dân Pháp, quy mô tác chiến của Quân đội ta phát triển như thế nào?", "options": ["Chủ yếu tác chiến phòng ngự trong các đô thị lớn, không tổ chức các trận đánh ở vùng nông thôn, rừng núi", "Ngay từ đầu đã tổ chức các chiến dịch hiệp đồng quân chủng, binh chủng quy mô lớn trên khắp các chiến trường", "Từ đánh du kích quy mô nhỏ, từng bước đánh địch quy mô tiểu đoàn, trung đoàn, đại đoàn và chiến dịch", "Chỉ duy trì lối đánh du kích nhỏ lẻ quy mô tiểu đội cho đến khi kết thúc cuộc kháng chiến chống thực dân Pháp"], "answer": 2, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 1, mục “Lịch sử Quân đội nhân dân Việt Nam”.", "explanation": ""}, {"id": 98, "set": 7, "number": 18, "level": "Thông hiểu", "text": "Theo sách giáo khoa lớp 10, Luật Quốc phòng năm 2018 quy định về những vấn đề gì?", "options": ["Biên giới quốc gia; chế độ pháp lý về biên giới quốc gia; xây dựng, quản lý, bảo vệ biên giới quốc gia và khu vực biên giới", "Vị trí, chức năng, nhiệm vụ, quyền hạn, tổ chức và hoạt động của lực lượng Cảnh sát biển Việt Nam", "Chính sách an ninh quốc gia; nguyên tắc, nhiệm vụ, biện pháp bảo vệ an ninh quốc gia; quyền, nghĩa vụ của công dân", "Nguyên tắc, chính sách, hoạt động cơ bản về quốc phòng; tình trạng chiến tranh, tình trạng khẩn cấp về quốc phòng"], "answer": 3, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 2, phần “Em có biết?”.", "explanation": ""}, {"id": 99, "set": 7, "number": 19, "level": "Thông hiểu", "text": "Theo sách giáo khoa lớp 10, tại nơi đường sắt giao nhau với đường bộ, quyền ưu tiên được quy định như thế nào?", "options": ["Người đi bộ và xe thô sơ được đi trước, sau đó mới đến phương tiện giao thông đường sắt", "Phương tiện nào đến nơi giao nhau trước thì được quyền đi trước, không phân biệt loại hình", "Phương tiện giao thông đường sắt phải dừng lại nhường đường cho xe ưu tiên của đường bộ", "Các phương tiện giao thông đường bộ phải nhường đường cho phương tiện giao thông đường sắt"], "answer": 3, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 4, mục “Đối với hoạt động giao thông đường sắt”.", "explanation": ""}, {"id": 100, "set": 7, "number": 20, "level": "Thông hiểu", "text": "Biện pháp nào sau đây được sách giáo khoa lớp 10 nêu để bảo mật thông tin cá nhân khi tham gia mạng xã hội?", "options": ["Kết bạn với càng nhiều tài khoản lạ càng tốt để mở rộng quan hệ và tăng lượt tương tác", "Công khai đầy đủ ngày sinh, địa chỉ, số điện thoại để bạn bè trên mạng dễ dàng xác minh danh tính", "Chia sẻ thông tin cá nhân có chọn lọc; không trả lời tin nhắn, không mở thư điện tử từ người lạ", "Dùng chung một tài khoản với nhiều người để tiết kiệm thời gian đăng kí và dễ quản lí"], "answer": 2, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 6, mục “Một số biện pháp bảo mật thông tin cá nhân”.", "explanation": ""}, {"id": 101, "set": 7, "number": 21, "level": "Thông hiểu", "text": "Theo quan điểm về đối tác, đối tượng trong Chiến lược bảo vệ Tổ quốc, những ai được xác định là đối tượng của chúng ta?", "options": ["Những nước, tổ chức không có quan hệ thương mại, đầu tư hoặc hợp tác quốc phòng với Việt Nam", "Những nước từng tham gia các cuộc chiến tranh xâm lược Việt Nam trong lịch sử dựng nước và giữ nước", "Bất kì thế lực nào có âm mưu và hành động chống phá mục tiêu xây dựng và bảo vệ Tổ quốc của ta", "Những nước có chế độ chính trị, trình độ phát triển kinh tế khác với Việt Nam ở trong và ngoài khu vực"], "answer": 2, "source": "SGK GDQP-AN 11, bài “Bảo vệ chủ quyền lãnh thổ, biên giới quốc gia” (nội dung 7), mục “Quan điểm”.", "explanation": ""}, {"id": 102, "set": 7, "number": 22, "level": "Thông hiểu", "text": "Theo sách giáo khoa lớp 11, tội phạm được hiểu là gì?", "options": ["Là hiện tượng xã hội tiêu cực, có tính phổ biến, lan truyền nhanh nhưng chưa đến mức bị xử lí bằng các chế tài của pháp luật hình sự", "Là hành vi nguy hiểm cho xã hội được quy định trong Bộ luật Hình sự, do người có năng lực trách nhiệm hình sự hoặc pháp nhân thương mại thực hiện", "Là mọi hành vi trái với chuẩn mực đạo đức, phong tục, tập quán của địa phương, do bất kì người nào thực hiện ở nơi công cộng hoặc trên không gian mạng", "Là hành vi vi phạm nội quy nhà trường, cơ quan, đơn vị, do học sinh, cán bộ, nhân viên thực hiện và bị xử lí kỉ luật"], "answer": 1, "source": "SGK GDQP-AN 11, bài “Phòng chống tệ nạn xã hội ở Việt Nam trong thời kì hội nhập quốc tế” (nội dung 8), mục “Khái niệm tội phạm”.", "explanation": ""}, {"id": 103, "set": 7, "number": 23, "level": "Thông hiểu", "text": "Theo sách giáo khoa lớp 12, thủ đoạn của chiến lược “diễn biến hoà bình” trên lĩnh vực tư tưởng là gì?", "options": ["Đòi “phi chính trị hoá” Quân đội nhân dân và Công an nhân dân, làm cho lực lượng vũ trang mất phương hướng", "Kích động gây mâu thuẫn giữa các dân tộc, tôn giáo nhằm chia rẽ, phá hoại khối đại đoàn kết toàn dân tộc", "Thúc đẩy tự do hoá, tư nhân hoá nền kinh tế nước ta nhằm xoá bỏ vai trò chủ đạo của nền kinh tế nhà nước", "Xuyên tạc, phủ nhận bản chất cách mạng và khoa học của chủ nghĩa Marx – Lenin, tư tưởng Hồ Chí Minh"], "answer": 3, "source": "SGK GDQP-AN 12, bài “Một số hiểu biết về chiến lược “diễn biến hoà bình”, bạo loạn lật đổ” (nội dung 15), mục “Âm mưu, thủ đoạn thực hiện chiến lược “diễn biến hoà bình””.", "explanation": ""}, {"id": 104, "set": 7, "number": 24, "level": "Thông hiểu", "text": "Nội dung “tiến hành chiến tranh nhân dân ở địa phương, làm nòng cốt cho toàn dân đánh giặc” trong nghệ thuật quân sự của lực lượng vũ trang địa phương được thể hiện như thế nào?", "options": ["Chỉ lực lượng vũ trang địa phương đánh giặc, nhân dân sơ tán toàn bộ khỏi địa bàn có chiến sự", "Mỗi địa phương là một mặt trận, mỗi người dân yêu nước là một chiến sĩ", "Giao toàn bộ nhiệm vụ tác chiến cho bộ đội chủ lực, địa phương chỉ làm nhiệm vụ hậu cần", "Tập trung toàn bộ lực lượng của các địa phương về một hướng để mở chiến dịch quy mô lớn"], "answer": 1, "source": "SGK GDQP-AN 12, bài “Truyền thống và nghệ thuật đánh giặc giữ nước của địa phương” (nội dung 16), mục “Một số nét chính về nghệ thuật quân sự của lực lượng vũ trang địa phương”.", "explanation": ""}, {"id": 105, "set": 7, "number": 25, "level": "Vận dụng", "text": "Xã đảo N cần phổ biến kiến thức quốc phòng và an ninh cho chủ tàu, thuyền hoạt động dài ngày trên biển. Theo Điều 21 Luật Giáo dục quốc phòng và an ninh, việc tổ chức được thực hiện như thế nào?", "options": ["Uỷ ban nhân dân chỉ đạo cơ quan quân sự cùng cấp chủ trì, phối hợp với Bộ đội biên phòng, Hải quân, Cảnh sát biển", "Chủ tàu, thuyền tự nghiên cứu tài liệu, vì pháp luật không quy định việc phổ biến kiến thức cho ngư dân trên biển", "Trường trung học phổ thông trên địa bàn chủ trì tổ chức, vì đây là nội dung thuộc môn học chính khoá của nhà trường", "Bộ Giáo dục và Đào tạo trực tiếp tổ chức lớp học tập trung tại trung tâm giáo dục quốc phòng và an ninh"], "answer": 0, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 21 khoản 1 điểm b, khoản 3.", "explanation": ""}, {"id": 106, "set": 7, "number": 26, "level": "Vận dụng", "text": "Do thiếu giáo viên, một sở giáo dục và đào tạo dự định tự ban hành định mức giáo viên giáo dục quốc phòng và an ninh áp dụng cho các trường trung học phổ thông trong tỉnh. Theo Điều 36 Luật Giáo dục quốc phòng và an ninh, thẩm quyền quy định định mức này thuộc về ai?", "options": ["Bộ Giáo dục và Đào tạo chủ trì, phối hợp với Bộ Quốc phòng, Bộ Nội vụ quy định", "Bộ chỉ huy quân sự cấp tỉnh quy định, vì đây là môn học có tính chất quân sự", "Hiệu trưởng từng trường quy định, căn cứ số lớp và số học sinh của trường mình", "Sở giáo dục và đào tạo tự quy định, phù hợp với điều kiện của từng địa phương"], "answer": 0, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 36 khoản 4.", "explanation": ""}, {"id": 107, "set": 7, "number": 27, "level": "Vận dụng", "text": "Cuối năm học, thầy giáo dạy môn Giáo dục quốc phòng và an ninh tự xếp mức đánh giá kết quả rèn luyện cả năm cho học sinh các lớp mình dạy. Theo Điều 8 Thông tư 22/2021/TT-BGDĐT, việc làm này có đúng không?", "options": ["Đúng, vì môn Giáo dục quốc phòng và an ninh là môn quyết định mức đánh giá kết quả rèn luyện của học sinh", "Không đúng, vì kết quả rèn luyện cả năm của học sinh do Ban đại diện cha mẹ học sinh của lớp đánh giá", "Đúng, vì mỗi giáo viên môn học đều có quyền xếp mức kết quả rèn luyện cả năm của học sinh mà mình trực tiếp giảng dạy", "Không đúng, vì giáo viên môn học chỉ nhận xét; giáo viên chủ nhiệm mới đánh giá kết quả rèn luyện của học sinh"], "answer": 3, "source": "Thông tư 22/2021/TT-BGDĐT, Điều 8 khoản 1 điểm b, điểm c.", "explanation": ""}, {"id": 108, "set": 7, "number": 28, "level": "Vận dụng", "text": "Thầy P phát hiện mình nhập nhầm một điểm kiểm tra của học sinh và muốn sửa lại. Theo Điều 20 Thông tư 22/2021/TT-BGDĐT, việc sửa chữa điểm của giáo viên môn học cần có điều gì?", "options": ["Quyết định cho phép của Sở Giáo dục và Đào tạo", "Xác nhận của giáo viên chủ nhiệm đối với việc sửa chữa điểm", "Sự đồng ý bằng văn bản của tất cả cha mẹ học sinh trong lớp", "Biểu quyết đồng ý của tập thể học sinh trong lớp"], "answer": 1, "source": "Thông tư 22/2021/TT-BGDĐT, Điều 20 khoản 2.", "explanation": ""}, {"id": 109, "set": 7, "number": 29, "level": "Vận dụng", "text": "Khi chọn đội tuyển tham gia hội thao giáo dục quốc phòng và an ninh, một giáo viên tuyên bố chỉ nhận học sinh nam và loại tất cả học sinh nữ dù có em đạt thành tích tốt hơn. Theo Luật Nhà giáo năm 2025, việc làm này thuộc trường hợp nào?", "options": ["Việc được khuyến khích: ưu tiên học sinh nam trong các môn có nội dung quân sự", "Việc chỉ bị cấm ở trường công lập, còn trường tư thục thì được phép", "Việc nhà giáo không được làm: phân biệt đối xử giữa những người học", "Quyền của nhà giáo: được chủ động lựa chọn người học theo ý muốn của mình"], "answer": 2, "source": "Luật Nhà giáo số 73/2025/QH15, Điều 11 khoản 2 điểm a.", "explanation": ""}, {"id": 110, "set": 7, "number": 30, "level": "Vận dụng", "text": "Một học sinh lớp 12 có hoàn cảnh khó khăn lo không đủ chi phí học tập, sinh hoạt khi vào đại học. Theo Điều 5 Nghị quyết số 248/2025/QH15, chính sách nào có thể hỗ trợ em?", "options": ["Người học được cấp toàn bộ chi phí sinh hoạt từ quỹ phúc lợi của trường trung học phổ thông nơi đã tốt nghiệp", "Người học được tiếp cận tín dụng ưu đãi từ Ngân hàng chính sách xã hội để trang trải chi phí học tập", "Người học được miễn toàn bộ chi phí sinh hoạt nếu đăng kí vào các cơ sở giáo dục đại học ngoài công lập", "Người học được vay không hoàn lại từ ngân sách của Uỷ ban nhân dân cấp xã nơi cư trú"], "answer": 1, "source": "Nghị quyết số 248/2025/QH15, Điều 5 khoản 1.", "explanation": ""}, {"id": 111, "set": 7, "number": 31, "level": "Vận dụng", "text": "Cho các sự kiện: (1) Công an nhân dân được thành lập; (2) Đảng thông qua “Nghị quyết về Đội tự vệ”; (3) Chủ tịch Hồ Chí Minh ra Lời kêu gọi Toàn quốc kháng chiến; (4) Đội Việt Nam Tuyên truyền Giải phóng quân được thành lập. Thứ tự thời gian đúng là gì?", "options": ["(2) → (4) → (1) → (3)", "(1) → (2) → (4) → (3)", "(2) → (1) → (4) → (3)", "(4) → (2) → (1) → (3)"], "answer": 0, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 1 (28/3/1935; 22/12/1944; 19/8/1945; 19/12/1946).", "explanation": ""}, {"id": 112, "set": 7, "number": 32, "level": "Vận dụng", "text": "Máy tính của Nam hay bị nhiễm mã độc. Một người bạn khuyên tải bản “bẻ khoá” của phần mềm diệt vi rút cho đỡ tốn tiền. Theo biện pháp bảo mật nêu trong sách giáo khoa lớp 10, Nam nên làm gì?", "options": ["Sử dụng phần mềm diệt vi rút có bản quyền và cập nhật hệ điều hành", "Chỉ cần tắt kết nối mạng mỗi khi thấy máy tính có dấu hiệu hoạt động bất thường", "Tải bản “bẻ khoá” vì tính năng giống hệt bản chính thức mà không mất chi phí", "Gỡ bỏ mọi phần
