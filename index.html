mềm diệt vi rút vì chúng làm chậm tốc độ xử lí của máy tính"], "answer": 0, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 6, mục “Một số biện pháp bảo mật thông tin cá nhân”.", "explanation": ""}, {"id": 113, "set": 7, "number": 33, "level": "Vận dụng", "text": "Hùng là công dân nam đủ 17 tuổi trong năm, chuẩn bị đăng kí nghĩa vụ quân sự lần đầu. Theo sách giáo khoa lớp 11, hồ sơ và hình thức đăng kí của Hùng như thế nào?", "options": ["Hồ sơ gồm đơn tình nguyện nhập ngũ và giấy khám sức khoẻ của bệnh viện; đăng kí qua nhà trường nơi đang học tập", "Hồ sơ gồm giấy khai sinh và học bạ; đăng kí tại cơ quan công an cấp xã nơi công dân có hộ khẩu thường trú", "Hồ sơ gồm phiếu tự khai sức khoẻ nghĩa vụ quân sự, bản chụp căn cước; đăng kí trực tuyến hoặc trực tiếp", "Hồ sơ gồm bằng tốt nghiệp trung học phổ thông và sơ yếu lí lịch; chỉ được đăng kí trực tiếp tại Bộ chỉ huy quân sự cấp tỉnh"], "answer": 2, "source": "SGK GDQP-AN 11, bài “Luật Nghĩa vụ quân sự và trách nhiệm của học sinh” (nội dung 11), mục “Đăng kí nghĩa vụ quân sự”.", "explanation": ""}, {"id": 114, "set": 7, "number": 34, "level": "Vận dụng", "text": "Để được xếp loại sức khoẻ không đủ điều kiện nhập ngũ, anh Q đưa 1 500 000 đồng cho một nhân viên y tế nhờ làm sai lệch kết quả phân loại sức khoẻ. Theo Nghị định số 218/2025/NĐ-CP nêu trong sách giáo khoa lớp 11, hành vi này bị xử phạt ở mức nào?", "options": ["Phạt tiền từ 50 000 000 đồng đến 75 000 000 đồng", "Phạt tiền từ 8 000 000 đồng đến 10 000 000 đồng", "Phạt tiền từ 30 000 000 đồng đến 40 000 000 đồng", "Phạt tiền từ 15 000 000 đồng đến 20 000 000 đồng"], "answer": 2, "source": "SGK GDQP-AN 11, bài “Luật Nghĩa vụ quân sự và trách nhiệm của học sinh” (nội dung 11), mục “Xử lí vi phạm hành chính” (đưa hoặc nhận tiền trị giá đến dưới 2 000 000 đồng để làm sai lệch kết quả phân loại sức khoẻ).", "explanation": ""}, {"id": 115, "set": 7, "number": 35, "level": "Vận dụng", "text": "Khi dọn vườn, ông A phát hiện một khẩu súng tự chế cũ. Theo sách giáo khoa lớp 11, ông A có thể giao nộp cho những cơ quan nào?", "options": ["Cửa hàng thu mua phế liệu hoặc cơ sở tái chế kim loại", "Trường học gần nhất để làm đồ dùng dạy học", "Chỉ cơ quan kiểm lâm hoặc cơ quan hải quan gần nhất", "Cơ quan công an, cơ quan quân sự hoặc Uỷ ban nhân dân cấp xã"], "answer": 3, "source": "SGK GDQP-AN 11, bài “Pháp luật về quản lí vũ khí, vật liệu nổ, công cụ hỗ trợ” (nội dung 10), mục về thu hồi và giao nộp vũ khí, vật liệu nổ, công cụ hỗ trợ.", "explanation": ""}, {"id": 116, "set": 7, "number": 36, "level": "Vận dụng", "text": "Có ý kiến cho rằng: “Bảo vệ chủ quyền biển, đảo là việc riêng của lực lượng Hải quân”. Dựa vào sách giáo khoa lớp 12, em nhận xét như thế nào?", "options": ["Đúng, vì ngư dân và các lực lượng khác tham gia sẽ làm phức tạp tình hình, ảnh hưởng đến đấu tranh ngoại giao", "Chưa đúng, vì phải huy động sức mạnh tổng hợp của toàn dân trên biển, đảo, trong đó Hải quân là nòng cốt", "Chưa đúng, vì nhiệm vụ này do lực lượng Công an nhân dân làm nòng cốt, Hải quân chỉ giữ vai trò phối hợp", "Đúng, vì chỉ lực lượng Hải quân mới có tàu thuyền, vũ khí và được pháp luật giao nhiệm vụ hoạt động trên các vùng biển, đảo"], "answer": 1, "source": "SGK GDQP-AN 12, bài “Bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa sau năm 1975” (nội dung 12), mục “Một số nét chính về nghệ thuật đấu tranh” bảo vệ chủ quyền biển, đảo.", "explanation": ""}, {"id": 117, "set": 7, "number": 37, "level": "Vận dụng cao", "text": "Tổ chuyên môn dự kiến kế hoạch kiểm tra, đánh giá môn Giáo dục quốc phòng và an ninh lớp 12 (35 tiết/năm học): (1) mỗi học kì chọn 03 điểm đánh giá thường xuyên; (2) bài kiểm tra giữa kì trên giấy làm trong 60 phút; (3) đánh giá cuối kì bằng bài thực hành bắn súng tiểu liên AK, có hướng dẫn và tiêu chí đánh giá. Đối chiếu Thông tư 22/2021/TT-BGDĐT, nhận định nào đúng?", "options": ["(1) và (2) phù hợp; (3) không phù hợp vì đánh giá cuối kì bắt buộc phải là bài kiểm tra trên giấy", "Cả ba nội dung đều phù hợp, vì tổ chuyên môn được tự quyết định số điểm và thời gian kiểm tra", "Chỉ (1) phù hợp; (2) phải là 90 phút và (3) không được dùng bài thực hành để đánh giá định kì", "Chỉ (3) phù hợp; (1) phải là 02 điểm đánh giá thường xuyên và (2) phải là 45 phút"], "answer": 3, "source": "Thông tư 22/2021/TT-BGDĐT, Điều 6 khoản 2 điểm b, Điều 7 khoản 1.", "explanation": ""}, {"id": 118, "set": 7, "number": 38, "level": "Vận dụng cao", "text": "Một sở giáo dục và đào tạo dự định: (1) ban hành chương trình môn Giáo dục quốc phòng và an ninh cấp trung học phổ thông áp dụng riêng cho tỉnh; (2) chỉ đạo các trường phân chia thời lượng, lựa chọn địa điểm, hình thức dạy học phù hợp điều kiện cụ thể. Đối chiếu Luật Giáo dục quốc phòng và an ninh và Thông tư 46/2020/TT-BGDĐT, nhận định nào đúng?", "options": ["(1) không đúng thẩm quyền, vì chương trình do Bộ Giáo dục và Đào tạo quy định; (2) đúng với hướng dẫn thực hiện chương trình", "Cả (1) và (2) đều không đúng, vì mọi nội dung về thời lượng, địa điểm, hình thức đều do Bộ Quốc phòng quyết định", "Cả (1) và (2) đều đúng, vì chương trình giáo dục phổ thông hiện hành có tính mở, giao quyền cho địa phương", "(1) đúng thẩm quyền, vì Uỷ ban nhân dân các cấp quản lý nhà nước về giáo dục quốc phòng và an ninh tại địa phương; (2) không đúng"], "answer": 0, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 36 khoản 2; Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục VIII.5.2.", "explanation": ""}, {"id": 119, "set": 7, "number": 39, "level": "Vận dụng cao", "text": "Cho ba nhận định về quan điểm của Chiến lược bảo vệ Tổ quốc trong tình hình mới: (1) phát huy mạnh mẽ nội lực là nhân tố quyết định, đồng thời tranh thủ tối đa mọi thuận lợi từ bên ngoài; (2) phát huy sức mạnh khối đại đoàn kết toàn dân tộc, của cả hệ thống chính trị, lực lượng vũ trang làm nòng cốt; (3) đối tượng của chúng ta là mọi quốc gia có chế độ chính trị khác với Việt Nam. Kết luận nào đúng?", "options": ["Nhận định (1) và (2) đúng; nhận định (3) sai", "Nhận định (1) và (3) đúng; nhận định (2) sai", "Nhận định (2) và (3) đúng; nhận định (1) sai", "Cả ba nhận định (1), (2) và (3) đều đúng"], "answer": 0, "source": "SGK GDQP-AN 11, bài “Bảo vệ chủ quyền lãnh thổ, biên giới quốc gia” (nội dung 7), mục “Quan điểm”.", "explanation": ""}, {"id": 120, "set": 7, "number": 40, "level": "Vận dụng cao", "text": "Ba công dân: A hoàn thành nhiệm vụ tham gia công an xã liên tục 30 tháng; B phục vụ trên tàu kiểm ngư đủ 24 tháng; C tốt nghiệp đại học, tình nguyện phục vụ tại đoàn kinh tế – quốc phòng đủ 24 tháng. Theo Luật Nghĩa vụ quân sự nêu trong sách giáo khoa lớp 11, ai được công nhận hoàn thành nghĩa vụ quân sự tại ngũ trong thời bình?", "options": ["B và C; A chưa đủ vì phải tham gia công an xã liên tục từ đủ 36 tháng trở lên", "A và B; C chưa đủ vì phải phục vụ tại đoàn kinh tế – quốc phòng từ đủ 36 tháng trở lên", "Cả A, B và C, vì đều đã có thời gian phục vụ từ đủ 24 tháng trở lên", "A và C; B chưa đủ vì phục vụ trên tàu kiểm ngư phải từ đủ 36 tháng trở lên"], "answer": 0, "source": "SGK GDQP-AN 11, bài “Luật Nghĩa vụ quân sự và trách nhiệm của học sinh” (nội dung 11), mục “Nghĩa vụ quân sự của công dân”.", "explanation": ""}, {"id": 121, "set": 8, "number": 1, "level": "Nhận biết", "text": "Luật Giáo dục quốc phòng và an ninh số 30/2013/QH13 có hiệu lực thi hành từ ngày nào?", "options": ["Ngày 10/4/2014", "Ngày 19/6/2013", "Ngày 01/7/2025", "Ngày 01/01/2014"], "answer": 3, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 46.", "explanation": ""}, {"id": 122, "set": 8, "number": 2, "level": "Nhận biết", "text": "Nghị quyết số 281/NQ-CP ban hành Chương trình hành động của Chính phủ thực hiện Nghị quyết số 71-NQ/TW được ban hành vào ngày, tháng, năm nào?", "options": ["Ngày 15/9/2025", "Ngày 22/8/2025", "Ngày 16/6/2025", "Ngày 10/12/2025"], "answer": 0, "source": "Nghị quyết số 281/NQ-CP, phần đầu văn bản.", "explanation": ""}, {"id": 123, "set": 8, "number": 3, "level": "Nhận biết", "text": "Theo Điều 7 Thông tư 22/2021/TT-BGDĐT, thời gian làm bài kiểm tra định kì đối với môn chuyên tối đa là bao nhiêu phút?", "options": ["120 phút", "45 phút", "60 phút", "90 phút"], "answer": 0, "source": "Thông tư 22/2021/TT-BGDĐT, Điều 7 khoản 1.", "explanation": ""}, {"id": 124, "set": 8, "number": 4, "level": "Nhận biết", "text": "Theo Danh mục thiết bị dạy học tối thiểu môn Giáo dục quốc phòng và an ninh ban hành kèm theo Thông tư 19/2022/TT-BGDĐT, số lượng lựu đạn luyện tập là bao nhiêu?", "options": ["25 quả", "05 quả", "50 quả", "20 quả"], "answer": 2, "source": "Thông tư 19/2022/TT-BGDĐT, Danh mục thiết bị dạy học tối thiểu.", "explanation": ""}, {"id": 125, "set": 8, "number": 5, "level": "Nhận biết", "text": "Theo sách giáo khoa lớp 10, Luật Giáo dục quốc phòng và an ninh năm 2013 gồm bao nhiêu chương, bao nhiêu điều?", "options": ["8 chương, 47 điều", "9 chương, 62 điều", "7 chương, 46 điều", "7 chương, 51 điều"], "answer": 0, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 2, mục “Luật Giáo dục quốc phòng và an ninh”.", "explanation": ""}, {"id": 126, "set": 8, "number": 6, "level": "Nhận biết", "text": "Theo Luật Nghĩa vụ quân sự, công dân nam từ đủ bao nhiêu tuổi trở lên thuộc đối tượng đăng kí nghĩa vụ quân sự?", "options": ["Đủ 20 tuổi", "Đủ 16 tuổi", "Đủ 17 tuổi", "Đủ 18 tuổi"], "answer": 2, "source": "SGK GDQP-AN 11, bài “Luật Nghĩa vụ quân sự và trách nhiệm của học sinh” (nội dung 11), mục “Đăng kí nghĩa vụ quân sự”.", "explanation": ""}, {"id": 127, "set": 8, "number": 7, "level": "Nhận biết", "text": "Công ước của Liên hợp quốc về Luật Biển năm 1982 được công bố vào ngày nào?", "options": ["Ngày 23/6/1994", "Ngày 10/12/1982", "Ngày 17/6/2003", "Ngày 16/11/1994"], "answer": 1, "source": "SGK GDQP-AN 11, bài “Bảo vệ chủ quyền lãnh thổ, biên giới quốc gia” (nội dung 7), mục “Công ước Liên hợp quốc về Luật Biển năm 1982”.", "explanation": ""}, {"id": 128, "set": 8, "number": 8, "level": "Nhận biết", "text": "Ngày 10/5/1975, tập đoàn Pol Pot – Ieng Sary đánh chiếm đảo nào, bắt và giết hơn 500 đồng bào ta?", "options": ["Đảo Phú Quốc", "Đảo Cồn Cỏ", "Đảo Thổ Chu", "Đảo Phú Quý"], "answer": 2, "source": "SGK GDQP-AN 12, bài “Bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa sau năm 1975” (nội dung 12), tư liệu về chiến tranh bảo vệ biên giới Tây Nam.", "explanation": ""}, {"id": 129, "set": 8, "number": 9, "level": "Thông hiểu", "text": "Theo Điều 13 Luật Giáo dục quốc phòng và an ninh, trường của tổ chức chính trị xây dựng và thực hiện chương trình, nội dung giáo dục quốc phòng và an ninh căn cứ vào đâu?", "options": ["Kế hoạch giáo dục của Uỷ ban nhân dân cấp xã nơi trường đặt trụ sở", "Chương trình môn học cấp trung học phổ thông của Bộ Giáo dục và Đào tạo", "Nguyện vọng của người học và điều kiện cơ sở vật chất của từng trường", "Chương trình khung của Bộ Quốc phòng và quy định của cấp có thẩm quyền"], "answer": 3, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 13 khoản 3.", "explanation": ""}, {"id": 130, "set": 8, "number": 10, "level": "Thông hiểu", "text": "Theo Điều 21 Luật Giáo dục quốc phòng và an ninh, ở khu vực biên giới, hải đảo, căn cứ điều kiện cụ thể, việc phổ biến kiến thức quốc phòng và an ninh được tổ chức cho những người nào?", "options": ["Người có vai trò, ảnh hưởng tích cực trong đồng bào dân tộc thiểu số; chủ tàu, thuyền hoạt động dài ngày trên biển", "Chỉ học sinh, sinh viên là con em đồng bào dân tộc thiểu số đang học tại các trường phổ thông dân tộc nội trú", "Chỉ khách du lịch và người nước ngoài tạm trú tại các xã biên giới, các đảo và quần đảo của Việt Nam", "Chỉ cán bộ, công chức cấp xã và lực lượng dân quân thường trực đang làm nhiệm vụ trên địa bàn biên giới, hải đảo"], "answer": 0, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 21 khoản 1 điểm b.", "explanation": ""}, {"id": 131, "set": 8, "number": 11, "level": "Thông hiểu", "text": "Nội dung nào sau đây thuộc nội dung quản lý nhà nước về giáo dục quốc phòng và an ninh theo Điều 32 Luật Giáo dục quốc phòng và an ninh?", "options": ["Tổ chức tuyển quân, giao nhận quân hằng năm tại các địa phương", "Trực tiếp chỉ huy các đơn vị bộ đội chủ lực huấn luyện, sẵn sàng chiến đấu", "Ban hành và tổ chức thực hiện văn bản quy phạm pháp luật về lĩnh vực này", "Xét xử các vụ án hình sự về tội xâm phạm an ninh quốc gia"], "answer": 2, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 32 khoản 1.", "explanation": ""}, {"id": 132, "set": 8, "number": 12, "level": "Thông hiểu", "text": "Theo Điều 39 Luật Giáo dục quốc phòng và an ninh (văn bản hợp nhất năm 2026), cơ quan nào chủ trì hướng dẫn các cơ quan thông tin đại chúng xây dựng chương trình, nội dung phổ biến kiến thức quốc phòng và an ninh cho toàn dân?", "options": ["Bộ Dân tộc và Tôn giáo", "Bộ Nội vụ", "Bộ Văn hoá, Thể thao và Du lịch", "Bộ Giáo dục và Đào tạo"], "answer": 2, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 39.", "explanation": ""}, {"id": 133, "set": 8, "number": 13, "level": "Thông hiểu", "text": "Quan điểm “tính dân tộc và nhân văn” trong xây dựng Chương trình môn Giáo dục quốc phòng và an ninh cấp trung học phổ thông hướng tới điều gì?", "options": ["Giúp học sinh chỉ tìm hiểu lịch sử quân sự thế giới, hạn chế nội dung về truyền thống của dân tộc", "Giúp học sinh nhận thức đúng về chủ nghĩa yêu nước, tinh thần dân tộc, đoàn kết quốc tế và các giá trị nhân văn", "Giúp học sinh thành thạo kĩ thuật, chiến thuật bộ binh để có thể thay thế bộ đội thường trực khi có chiến tranh", "Giúp học sinh so sánh sức mạnh quân sự giữa các quốc gia để xác định đối tượng tác chiến của Việt Nam"], "answer": 1, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục II.4.", "explanation": ""}, {"id": 134, "set": 8, "number": 14, "level": "Thông hiểu", "text": "Theo Chương trình môn Giáo dục quốc phòng và an ninh cấp trung học phổ thông, “bãi tập” được hiểu là gì?", "options": ["Phòng học bộ môn được tích hợp dùng cho cả học lí thuyết và thực hành môn học", "Kho bảo quản vũ khí, trang bị và thiết bị dạy học của nhà trường", "Trường bắn đạn thật của đơn vị quân đội đóng quân trên địa bàn tỉnh, thành phố", "Bãi rộng như sân trường, sân vận động dùng để thục luyện thực hành"], "answer": 3, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục VIII.1.1.", "explanation": ""}, {"id": 135, "set": 8, "number": 15, "level": "Thông hiểu", "text": "Theo Điều 8 Thông tư 22/2021/TT-BGDĐT, việc đánh giá kết quả rèn luyện của học sinh căn cứ vào đâu?", "options": ["Yêu cầu cần đạt về phẩm chất, năng lực quy định trong Chương trình giáo dục phổ thông", "Kết quả bình bầu của tập thể lớp và ý kiến của Ban đại diện cha mẹ học sinh", "Số ngày nghỉ học có phép và không phép của học sinh được ghi trong sổ đầu bài của lớp", "Điểm trung bình các môn học cả năm và thứ hạng của học sinh trong lớp"], "answer": 0, "source": "Thông tư 22/2021/TT-BGDĐT, Điều 8 khoản 1 điểm a.", "explanation": ""}, {"id": 136, "set": 8, "number": 16, "level": "Thông hiểu", "text": "Theo Điều 4 Nghị quyết số 248/2025/QH15, trong chuyển đổi số giáo dục, Nhà nước ưu tiên đầu tư xây dựng những gì?", "options": ["Các trung tâm học thêm trực tuyến và ứng dụng luyện thi có thu phí", "Hệ thống phòng máy tính tại nhà cho tất cả giáo viên phổ thông", "Mạng xã hội riêng dành cho học sinh, sinh viên trên phạm vi toàn quốc", "Cơ sở dữ liệu quốc gia về giáo dục và đào tạo, hạ tầng số"], "answer": 3, "source": "Nghị quyết số 248/2025/QH15, Điều 4 khoản 1.", "explanation": ""}, {"id": 137, "set": 8, "number": 17, "level": "Thông hiểu", "text": "Theo sách giáo khoa lớp 10, trong kháng chiến chống thực dân Pháp, lực lượng Dân quân tự vệ giữ vai trò gì?", "options": ["Làm nòng cốt cho toàn dân đánh giặc, chiến tranh du kích ở địa phương", "Là lực lượng chủ lực cơ động, mở các chiến dịch quy mô đại đoàn", "Là lực lượng chuyên trách bảo vệ an ninh chính trị ở các đô thị", "Là lực lượng dự bị, chỉ tham gia sản xuất và tiếp tế cho tiền tuyến"], "answer": 0, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 1, mục “Lịch sử Dân quân tự vệ”.", "explanation": ""}, {"id": 138, "set": 8, "number": 18, "level": "Thông hiểu", "text": "Theo Điều 31 Luật Công an nhân dân (trích trong sách giáo khoa lớp 10), nghĩa vụ, trách nhiệm của sĩ quan, hạ sĩ quan, chiến sĩ Công an nhân dân là gì?", "options": ["Tuyệt đối trung thành với Tổ quốc, Nhân dân, với Đảng và Nhà nước; tận tuỵ phục vụ Nhân dân", "Tham gia lao động sản xuất tại địa phương, không thoát li công tác và chỉ tập trung khi có lệnh huy động", "Hoàn thành chương trình bồi dưỡng kiến thức quốc phòng và an ninh do Hội đồng cấp xã triệu tập hằng năm", "Thực hiện nghĩa vụ quân sự tại ngũ đủ 24 tháng trước khi được xét tuyển vào lực lượng Công an nhân dân"], "answer": 0, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 2, mục “Luật Công an nhân dân” (trích Điều 31).", "explanation": ""}, {"id": 139, "set": 8, "number": 19, "level": "Thông hiểu", "text": "Theo sách giáo khoa lớp 10, quy định về đội mũ bảo hiểm khi điều khiển xe đạp, xe gắn máy, xe mô tô hai bánh là gì?", "options": ["Người đi xe đạp cũng bắt buộc phải đội mũ bảo hiểm có cài quai đúng quy cách", "Mọi người trên xe (trừ xe đạp) phải đội mũ bảo hiểm cài quai đúng quy cách", "Chỉ phải đội mũ bảo hiểm khi đi trên đường quốc lộ và đường cao tốc", "Chỉ người điều khiển xe phải đội mũ bảo hiểm, người ngồi sau không bắt buộc"], "answer": 1, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 4, mục “Đối với hoạt động giao thông đường bộ”.", "explanation": ""}, {"id": 140, "set": 8, "number": 20, "level": "Thông hiểu", "text": "Theo nội dung Luật An ninh mạng nêu trong sách giáo khoa lớp 10, chủ quản hệ thống thông tin, doanh nghiệp cung cấp dịch vụ trên mạng có trách nhiệm gì đối với trẻ em?", "options": ["Thu thập đầy đủ thông tin cá nhân của trẻ em để cung cấp cho các đơn vị quảng cáo khi có yêu cầu", "Chỉ chịu trách nhiệm khi có yêu cầu bằng văn bản của cha mẹ hoặc người giám hộ của trẻ em", "Kiểm soát nội dung thông tin trên hệ thống, dịch vụ của mình để không gây nguy hại cho trẻ em", "Cấm hoàn toàn trẻ em truy cập Internet và sử dụng các dịch vụ trên không gian mạng"], "answer": 2, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 6, mục “Bảo vệ trẻ em trên không gian mạng”.", "explanation": ""}, {"id": 141, "set": 8, "number": 21, "level": "Thông hiểu", "text": "Theo Luật Biên giới quốc gia, biên giới quốc gia của nước Cộng hoà xã hội chủ nghĩa Việt Nam là gì?", "options": ["Là hệ thống các mốc quốc giới bằng bê tông được xây dựng dọc theo đường biên trên đất liền với các nước láng giềng", "Là ranh giới phía ngoài của vùng đặc quyền kinh tế và thềm lục địa của Việt Nam được xác định trên hải đồ", "Là phần lãnh thổ thuộc các xã, phường có địa giới hành chính tiếp giáp với lãnh thổ của các nước láng giềng", "Là đường và mặt thẳng đứng theo đường đó để xác định giới hạn lãnh thổ đất liền, đảo, vùng biển, lòng đất, vùng trời"], "answer": 3, "source": "SGK GDQP-AN 11, bài “Bảo vệ chủ quyền lãnh thổ, biên giới quốc gia” (nội dung 7), mục “Biên giới quốc gia”.", "explanation": ""}, {"id": 142, "set": 8, "number": 22, "level": "Thông hiểu", "text": "Theo sách giáo khoa lớp 11, vũ khí thô sơ được hiểu như thế nào?", "options": ["Là loại vũ khí được trang bị cho lực lượng vũ trang, phục vụ cho mục đích quân sự, quốc phòng", "Là thiết bị, vật phẩm chứa thuốc nổ có tác dụng tạo xung kích thích ban đầu làm nổ khối thuốc nổ", "Là loại vũ khí có cấu tạo và nguyên lí hoạt động đơn giản, được chế tạo thủ công hoặc công nghiệp", "Là hoá chất hoặc hỗn hợp chất được sản xuất nhằm tạo ra phản ứng nổ dưới tác động của xung kích thích"], "answer": 2, "source": "SGK GDQP-AN 11, bài “Pháp luật về quản lí vũ khí, vật liệu nổ, công cụ hỗ trợ” (nội dung 10), mục “Một số khái niệm”.", "explanation": ""}, {"id": 143, "set": 8, "number": 23, "level": "Thông hiểu", "text": "Giải pháp “hình thành khả năng ‘miễn nhiễm’, nâng cao ‘sức đề kháng’ của xã hội” trong phòng, chống chiến lược “diễn biến hoà bình” gắn với việc làm nào?", "options": ["Chỉ dựa vào lực lượng vũ trang để xử lí các điểm nóng về an ninh, trật tự", "Chú trọng tuyên truyền, giáo dục đường lối của Đảng, pháp luật của Nhà nước", "Hạn chế giao lưu, hợp tác quốc tế trên các lĩnh vực văn hoá, giáo dục", "Ngăn chặn toàn bộ việc sử dụng Internet và mạng xã hội trong nhân dân"], "answer": 1, "source": "SGK GDQP-AN 12, bài “Một số hiểu biết về chiến lược “diễn biến hoà bình”, bạo loạn lật đổ” (nội dung 15), mục “Một số giải pháp phòng, chống chiến lược “diễn biến hoà bình”, bạo loạn lật đổ”.", "explanation": ""}, {"id": 144, "set": 8, "number": 24, "level": "Thông hiểu", "text": "Theo sách giáo khoa lớp 12, phương châm “bốn tại chỗ” của lực lượng vũ trang địa phương gồm những nội dung nào?", "options": ["Bám dân tại chỗ, bám đất tại chỗ, bám địch tại chỗ, bám làng tại chỗ", "Sản xuất tại chỗ, tiêu thụ tại chỗ, dự trữ tại chỗ, phân phối tại chỗ", "Chỉ huy tại chỗ, lực lượng tại chỗ, phương tiện tại chỗ, hậu cần tại chỗ", "Tuyển quân tại chỗ, huấn luyện tại chỗ, đóng quân tại chỗ, xuất ngũ tại chỗ"], "answer": 2, "source": "SGK GDQP-AN 12, bài “Truyền thống và nghệ thuật đánh giặc giữ nước của địa phương” (nội dung 16), mục “Một số nét chính về nghệ thuật quân sự của lực lượng vũ trang địa phương”.", "explanation": ""}, {"id": 145, "set": 8, "number": 25, "level": "Vận dụng", "text": "Tỉnh K dự kiến mở lớp bồi dưỡng kiến thức quốc phòng và an ninh cho chức sắc, chức việc tôn giáo và già làng trên địa bàn. Theo Điều 16 Luật Giáo dục quốc phòng và an ninh, cơ quan nào chủ trì tổ chức?", "options": ["Trường trung học phổ thông trên địa bàn chủ trì, phối hợp với Ban đại diện cha mẹ học sinh của trường", "Uỷ ban nhân dân cấp tỉnh chủ trì, phối hợp với Mặt trận Tổ quốc Việt Nam cùng cấp", "Bộ Giáo dục và Đào tạo chủ trì, phối hợp với các cơ sở giáo dục đại học đóng trên địa bàn tỉnh", "Các tổ chức tôn giáo tự tổ chức, cơ quan nhà nước không tham gia vào nội dung và chương trình bồi dưỡng"], "answer": 1, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 16 khoản 2.", "explanation": ""}, {"id": 146, "set": 8, "number": 26, "level": "Vận dụng", "text": "Trong lễ giao nhận quân, xã H kết hợp tổ chức nói chuyện truyền thống và giới thiệu nhiệm vụ quốc phòng, an ninh cho nhân dân. Theo Điều 20 Luật Giáo dục quốc phòng và an ninh, cách làm này được nhìn nhận như thế nào?", "options": ["Không phù hợp, vì lễ giao nhận quân là hoạt động quân sự, không được kết hợp với hoạt động tuyên truyền", "Chỉ phù hợp khi người nói chuyện là giáo viên giáo dục quốc phòng và an ninh của trường trung học phổ thông", "Không phù hợp, vì phổ biến kiến thức quốc phòng và an ninh chỉ được thực hiện qua các phương tiện thông tin đại chúng", "Phù hợp, vì việc phổ biến được lồng ghép vào các đợt gọi công dân nhập ngũ, ngày kỷ niệm, ngày truyền thống"], "answer": 3, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 20 khoản 3.", "explanation": ""}, {"id": 147, "set": 8, "number": 27, "level": "Vận dụng", "text": "Khi xây dựng kế hoạch bài dạy “Kĩ thuật sử dụng lựu đạn” ở lớp 11, một giáo viên dự kiến dạy 3 tiết lí thuyết và 2 tiết thực hành. Đối chiếu Chương trình môn Giáo dục quốc phòng và an ninh cấp trung học phổ thông, dự kiến này như thế nào?", "options": ["Chưa phù hợp, vì nội dung này chỉ có 4 tiết và toàn bộ là tiết thực hành", "Phù hợp, vì nội dung này có 5 tiết, gồm 3 tiết lí thuyết và 2 tiết thực hành", "Chưa phù hợp, vì nội dung này có 5 tiết, gồm 1 tiết lí thuyết và 4 tiết thực hành", "Chưa phù hợp, vì nội dung này có 7 tiết, gồm 3 tiết lí thuyết và 4 tiết thực hành"], "answer": 2, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.2 (lớp 11).", "explanation": ""}, {"id": 148, "set": 8, "number": 28, "level": "Vận dụng", "text": "Cha mẹ một học sinh gửi cho giáo viên chủ nhiệm thông tin về sự tiến bộ của con trong rèn luyện ở nhà. Theo Điều 5 và Điều 8 Thông tư 22/2021/TT-BGDĐT, thông tin này được sử dụng như thế nào?", "options": ["Không được sử dụng, vì chỉ giáo viên mới có quyền nhận xét việc thực hiện nhiệm vụ rèn luyện của học sinh", "Thay thế hoàn toàn nhận xét của giáo viên môn học và giáo viên chủ nhiệm về kết quả rèn luyện", "Là thông tin phản hồi để giáo viên chủ nhiệm tham khảo khi nhận xét, đánh giá kết quả rèn luyện", "Chỉ được sử dụng khi có xác nhận của Uỷ ban nhân dân cấp xã nơi học sinh cư trú"], "answer": 2, "source": "Thông tư 22/2021/TT-BGDĐT, Điều 5 khoản 1 điểm c, Điều 8 khoản 1 điểm c.", "explanation": ""}, {"id": 149, "set": 8, "number": 29, "level": "Vận dụng", "text": "Thầy D được cử tham gia chương trình bồi dưỡng thường xuyên và bồi dưỡng theo chuẩn nghề nghiệp. Theo Điều 29 Luật Nhà giáo năm 2025, về kinh phí thực hiện các chương trình đào tạo, bồi dưỡng nhà giáo, nhận định nào đúng?", "options": ["Nhà giáo phải tự chi trả toàn bộ kinh phí của mọi chương trình bồi dưỡng", "Kinh phí chỉ do cha mẹ học sinh đóng góp thông qua quỹ của lớp, của trường", "Nhà nước chỉ hỗ trợ kinh phí đối với nhà giáo trong cơ sở giáo dục đại học", "Nhà nước hỗ trợ kinh phí thực hiện chương trình đào tạo, bồi dưỡng nhà giáo"], "answer": 3, "source": "Luật Nhà giáo số 73/2025/QH15, Điều 29 khoản 1, khoản 2.", "explanation": ""}, {"id": 150, "set": 8, "number": 30, "level": "Vận dụng", "text": "Một sinh viên năm thứ nhất hỏi về chính sách đối với môn Giáo dục quốc phòng và an ninh ở trường đại học. Theo Điều 3 Nghị quyết số 248/2025/QH15, nhận định nào đúng?", "options": ["Sinh viên được miễn học môn này nếu đã học đủ ba năm ở trung học phổ thông", "Học phí và giáo trình môn học này do cơ quan quân sự địa phương chi trả toàn bộ", "Sinh viên phải đóng học phí gấp đôi vì môn học cần nhiều thiết bị, vũ khí, trang bị", "Nhà nước bảo đảm nguồn lực để miễn học phí và giáo trình môn học này theo lộ trình"], "answer": 3, "source": "Nghị quyết số 248/2025/QH15, Điều 3 khoản 1.", "explanation": ""}, {"id": 151, "set": 8, "number": 31, "level": "Vận dụng", "text": "Anh Nam tốt nghiệp một trường đại học ngoài quân đội rồi nhập ngũ và đang là binh sĩ. Anh muốn biết mình có thể trở thành sĩ quan tại ngũ không. Theo sách giáo khoa lớp 10, câu trả lời nào đúng?", "options": ["Có thể, vì binh sĩ tốt nghiệp đại học ngoài quân đội là một nguồn bổ sung sĩ quan tại ngũ", "Không thể, vì chỉ người tốt nghiệp các trường đào tạo sĩ quan mới được bổ sung làm sĩ quan tại ngũ", "Không thể, vì binh sĩ sau khi hết thời hạn phục vụ tại ngũ bắt buộc phải xuất ngũ về địa phương", "Có thể, nhưng anh phải xuất ngũ và thi lại vào một trường đào tạo sĩ quan từ đầu"], "answer": 0, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 2, mục “Tiêu chuẩn” (nguồn bổ sung sĩ quan tại ngũ).", "explanation": ""}, {"id": 152, "set": 8, "number": 32, "level": "Vận dụng", "text": "Trên chuyến bay cùng gia đình, tiếp viên yêu cầu hành khách thắt dây an toàn và ngồi yên tại chỗ. Em trai của Hà vẫn muốn đứng dậy đi lại. Theo sách giáo khoa lớp 10, Hà nên giải thích với em như thế nào?", "options": ["Trẻ em không phải thực hiện các hướng dẫn về an toàn dành cho hành khách người lớn", "Khi đi máy bay, mọi người phải tuyệt đối tuân thủ hướng dẫn của tiếp viên", "Hành khách được tự quyết định việc đi lại vì đã mua vé và có chỗ ngồi riêng", "Hành khách chỉ cần thực hiện yêu cầu của tiếp viên khi máy bay cất cánh và hạ cánh"], "answer": 1, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 4, mục “Đối với hoạt động giao thông đường hàng không”.", "explanation": ""}, {"id": 153, "set": 8, "number": 33, "level": "Vận dụng", "text": "Một người quen rủ Bình mua phần mềm chuyên dùng để chiếm đoạt tài khoản trò chơi của người khác rồi bán lại kiếm lời. Dựa vào sách giáo khoa lớp 11, nhận định nào đúng?", "options": ["Đây là hoạt động kinh doanh bình thường trên mạng, pháp luật không điều chỉnh", "Mua bán công cụ, thiết bị, phần mềm để sử dụng vào mục đích trái pháp luật là hành vi bị nghiêm cấm", "Chỉ người trực tiếp dùng phần mềm để chiếm đoạt tài khoản mới vi phạm, người mua bán thì không", "Được phép mua bán nếu phần mềm chỉ dùng với tài khoản trò chơi, không dùng với tài khoản ngân hàng"], "answer": 1, "source": "SGK GDQP-AN 11, bài “Phòng chống tệ nạn xã hội ở Việt Nam trong thời kì hội nhập quốc tế” (nội dung 8), mục “Quy định của pháp luật về phòng chống tội phạm sử dụng công nghệ cao”.", "explanation": ""}, {"id": 154, "set": 8, "number": 34, "level": "Vận dụng", "text": "Trước khi nhập ngũ, anh Tùng đã có giấy gọi vào học tại một trường đại học. Sau khi xuất ngũ, anh muốn biết quyền lợi học tập của mình. Theo Luật Nghĩa vụ quân sự nêu trong sách giáo khoa lớp 11, câu trả lời nào đúng?", "options": ["Anh chỉ được học các trường thuộc Quân đội nhân dân Việt Nam", "Anh phải thi lại từ đầu vì giấy gọi vào học đã hết giá trị", "Anh không được đi học trong 24 tháng đầu sau khi xuất ngũ", "Anh được bảo lưu kết quả và được tiếp nhận vào học ở trường đó"], "answer": 3, "source": "SGK GDQP-AN 11, bài “Luật Nghĩa vụ quân sự và trách nhiệm của học sinh” (nội dung 11), mục “Một số chế độ, chính sách đối với hạ sĩ quan, binh sĩ phục vụ tại ngũ, xuất ngũ và thân nhân”.", "explanation": ""}, {"id": 155, "set": 8, "number": 35, "level": "Vận dụng", "text": "Chị Mai (nữ, trong độ tuổi gọi nhập ngũ) muốn thực hiện nghĩa vụ tham gia Công an nhân dân. Theo Nghị định 70/2019/NĐ-CP nêu trong sách giáo khoa lớp 11, chị được xem xét, tuyển chọn khi nào?", "options": ["Không được xem xét, vì chỉ công dân nam mới thực hiện nghĩa vụ tham gia Công an nhân dân", "Đã đăng kí nghĩa vụ quân sự, có chuyên môn phù hợp, tự nguyện và ngành Công an có nhu cầu", "Chỉ cần có bằng tốt nghiệp trung học phổ thông và có đơn tình nguyện gửi Công an cấp xã", "Khi đã hoàn thành nghĩa vụ quân sự tại ngũ trong Quân đội nhân dân đủ 24 tháng"], "answer": 1, "source": "SGK GDQP-AN 11, bài “Luật Nghĩa vụ quân sự và trách nhiệm của học sinh” (nội dung 11), mục “Đối tượng tuyển chọn” thực hiện nghĩa vụ tham gia Công an nhân dân.", "explanation": ""}, {"id": 156, "set": 8, "number": 36, "level": "Vận dụng", "text": "Trước một vấn đề nhạy cảm ở địa phương, một tài khoản giả mạo đăng hình ảnh cắt ghép và kêu gọi mọi người chia sẻ. Vận dụng kiến thức sách giáo khoa lớp 12, em nhận diện và xử lí như thế nào?", "options": ["Đây là thủ đoạn dùng tài khoản giả mạo để cắt ghép, xuyên tạc; không chia sẻ và phản bác", "Đây là thông tin tham khảo bình thường; nên chia sẻ rộng rãi để mọi người cùng bàn luận, đánh giá", "Đây là quyền tự do ngôn luận của chủ tài khoản; học sinh không nên có bất kì phản ứng nào", "Đây là việc của cơ quan chức năng; học sinh nên chia sẻ trước rồi chờ thông tin chính thức sau"], "answer": 0, "source": "SGK GDQP-AN 12, bài “Một số hiểu biết về chiến lược “diễn biến hoà bình”, bạo loạn lật đổ” (nội dung 15), phần “Em có biết?” về thủ đoạn trên không gian mạng; mục “Trách nhiệm của học sinh”.", "explanation": ""}, {"id": 157, "set": 8, "number": 37, "level": "Vận dụng cao", "text": "Ba người tham gia bồi dưỡng kiến thức quốc phòng và an ninh: (a) một công chức cấp xã; (b) giám đốc một doanh nghiệp tư nhân quy mô vừa; (c) một chức sắc tôn giáo ở xa nơi mở lớp. Theo Điều 18 Luật Giáo dục quốc phòng và an ninh, nguồn bảo đảm tiền tàu, xe và hỗ trợ tiền ăn của từng người như thế nào?", "options": ["(a) và (b) do doanh nghiệp bảo đảm; (c) do tổ chức tôn giáo bảo đảm", "(a) do ngân sách nhà nước bảo đảm; (b) và (c) tự bảo đảm", "(a), (b) và (c) đều do ngân sách nhà nước bảo đảm", "(a) và (c) do ngân sách nhà nước bảo đảm; (b) do doanh nghiệp bảo đảm"], "answer": 3, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 18 khoản 1, khoản 2, khoản 3.", "explanation": ""}, {"id": 158, "set": 8, "number": 38, "level": "Vận dụng cao", "text": "Căn cứ bảng phân bổ thời lượng của Chương trình môn Giáo dục quốc phòng và an ninh cấp trung học phổ thông (lớp 10: 18 tiết lí thuyết, 17 tiết thực hành; lớp 11 và lớp 12: mỗi lớp 19 tiết lí thuyết, 16 tiết thực hành), tổng số tiết lí thuyết và thực hành của cả cấp học là bao nhiêu?", "options": ["57 tiết lí thuyết và 48 tiết thực hành", "56 tiết lí thuyết và 49 tiết thực hành", "49 tiết lí thuyết và 56 tiết thực hành", "54 tiết lí thuyết và 51 tiết thực hành"], "answer": 1, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.2 (18 + 19 + 19 = 56; 17 + 16 + 16 = 49; tổng 105 tiết).", "explanation": ""}, {"id": 159, "set": 8, "number": 39, "level": "Vận dụng cao", "text": "Cho ba nhận định về pháp luật quản lí vũ khí, vật liệu nổ, công cụ hỗ trợ: (1) súng tự chế thuộc nhóm vũ khí quân dụng; (2) người quản lí kho vũ khí, vật liệu nổ phải được huấn luyện và cấp chứng chỉ; (3) cơ quan Kiểm lâm, Hải quan không thuộc đối tượng được trang bị vũ khí, công cụ hỗ trợ. Theo sách giáo khoa lớp 11, kết luận nào đúng?", "options": ["Nhận định (1) và (2) đúng; nhận định (3) sai", "Nhận định (1) và (3) đúng; nhận định (2) sai", "Nhận định (2) và (3) đúng; nhận định (1) sai", "Cả ba nhận định (1), (2) và (3) đều đúng"], "answer": 0, "source": "SGK GDQP-AN 11, bài “Pháp luật về quản lí vũ khí, vật liệu nổ, công cụ hỗ trợ” (nội dung 10), mục “Một số khái niệm” và nội dung cơ bản của Luật (đối tượng được trang bị gồm Công an, Quân đội, Kiểm lâm, Hải quan…).", "explanation": ""}, {"id": 160, "set": 8, "number": 40, "level": "Vận dụng cao", "text": "Tại địa phương X, trên mạng xã hội xuất hiện tin giả về một dự án, kèm lời kêu gọi tụ tập; sau đó một số kẻ quá khích kích động đám đông đập phá trụ sở cơ quan. Vận dụng kiến thức sách giáo khoa lớp 12, phân tích nào đúng nhất?", "options": ["Tin giả trên mạng và việc đập phá là hai sự việc không liên quan; chỉ cần xử lí hành chính người đăng tin, không cần quan tâm đến đám đông", "Tin giả, kêu gọi tụ tập là thủ đoạn tạo thời cơ; đập phá có tổ chức là dấu hiệu bạo loạn, cần xử lí kiên quyết, đúng đối tượng", "Mọi người có mặt tại hiện trường đều phải bị xử lí như nhau, không cần phân biệt kẻ cầm đầu với người bị kích động, lôi kéo", "Toàn bộ sự việc là sinh hoạt dân chủ bình thường; cơ quan chức năng không nên can thiệp để tránh gây căng thẳng cho người dân"], "answer": 1, "source": "SGK GDQP-AN 12, bài “Một số hiểu biết về chiến lược “diễn biến hoà bình”, bạo loạn lật đổ” (nội dung 15), mục về mối quan hệ, thủ đoạn trên không gian mạng, thủ đoạn thực hiện bạo loạn lật đổ và giải pháp phòng, chống.", "explanation": ""}];</script><script>const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='gdqp-de58-thpt-160-20261125-v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{wrong:[],bookmarks:[],history:[]}}catch{db={wrong:[],bookmarks:[],history:[]}}let active=null,timer=null;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}};const bank=QUESTIONS.filter(q=>!q.placeholder);const shuffle=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function dashboard(){clearInterval(timer);active=null;$('#app').innerHTML=`<section class="hero"><div><div class="eyebrow">GDQP&AN · Tài liệu ôn luyện được cung cấp</div><h1>Ôn luyện GDQP&AN · Đề 5–8</h1><p>160 câu hỏi · Bốn đề số 5, 6, 7 và 8, mỗi đề 40 câu. Luyện từng câu, tra cứu tài liệu và xem lại kết quả.</p><button class="lime" data-start="practice">Luyện tổng hợp 160 câu →</button></div><div class="emblem">★<small>ÔN TẬP KIẾN THỨC</small></div></section><section class="stats"><div class="stat"><strong>160</strong><span class="muted">Câu hỏi đầy đủ</span></div><div class="stat"><strong>${db.history.length}</strong><span class="muted">Lượt đã hoàn thành</span></div><div class="stat"><strong>${db.wrong.length}</strong><span class="muted">Câu cần ôn lại</span></div><div class="stat"><strong>${db.bookmarks.length}</strong><span class="muted">Câu đã đánh dấu</span></div></section><div class="notice">Nội dung, đáp án và nguồn dẫn được nhập từ file anh cung cấp, chưa thẩm định lại. Nguồn đối chiếu được hiển thị khi kiểm tra đáp án. Đáp án đã được đối chiếu giữa nội dung từng câu và bảng đáp án cuối mỗi đề; chưa thẩm định lại kiến thức và hiệu lực văn bản. Vị trí phương án được đảo khi luyện. Thời gian thi thử do anh chọn, không phải thời gian quy định trong tài liệu.</div><div class="panel"><h3>Thiết lập thời gian mỗi đề</h3><select id="duration" aria-label="Thời gian thi thử"><option value="40" selected>40 phút</option><option value="50">50 phút</option><option value="60">60 phút</option></select></div><h2 style="margin-top:25px">Chọn bộ đề</h2><section class="grid">${[5,6,7,8].map(n=>`<article class="card"><span class="tag">ĐỀ ${n} · 40 CÂU</span><h3>Đề ${n}</h3><button data-topic="${n}">Luyện từng câu →</button><button class="primary" data-exam="${n}">Thi thử đề ${n} →</button></article>`).join('')}<article class="card"><h3>Củng cố kiến thức</h3><button data-start="wrong">Ôn câu sai (${db.wrong.length})</button><button data-start="bookmarks">Câu đánh dấu (${db.bookmarks.length})</button></article></section><h2 style="margin-top:30px">Tra cứu câu hỏi</h2><div class="tools"><input id="search" placeholder="Tìm nội dung câu hỏi…" aria-label="Tìm câu hỏi"><select id="level" aria-label="Mức độ"><option value="">Tất cả mức độ</option>${[...new Set(bank.map(q=>q.level))].map(l=>`<option>${esc(l)}</option>`).join('')}</select><button id="browse">Tra cứu</button></div><div id="searchResults"></div><h2 style="margin-top:30px">Lịch sử luyện tập</h2>${db.history.slice(0,10).map(h=>`<div class="history row"><span>${esc(h.mode)} · ${esc(h.date)}</span><b>${h.correct}/${h.total} câu đúng · ${h.score}/10</b></div>`).join('')||'<p class="muted">Chưa có lượt hoàn thành.</p>'}<p class="muted">Tiến độ được lưu trên trình duyệt và thiết bị đang sử dụng.</p>`;document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start));document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>start('practice',+b.dataset.topic));document.querySelectorAll('[data-exam]').forEach(b=>b.onclick=()=>start('exam',+b.dataset.exam));$('#browse').onclick=browse;$('#search').oninput=browse;$('#level').onchange=browse}
function browse(){let s=$('#search').value.toLocaleLowerCase('vi'),l=$('#level').value;let list=bank.filter(q=>(!l||q.level===l)&&(q.text+' '+q.options.join(' ')).toLocaleLowerCase('vi').includes(s));$('#searchResults').innerHTML=`<p class="muted">${list.length} câu phù hợp</p>`+list.map(q=>`<div class="review-item"><span class="tag">Đề ${q.set} · Câu ${q.number} · ${esc(q.level)}</span><p>${esc(q.text)}</p><details><summary>Xem phương án và đáp án từ tài liệu</summary>${q.options.map((o,i)=>`<p>${'ABCD'[i]}. ${esc(o)} ${i===q.answer?'✓':''}</p>`).join('')}</details></div>`).join('')}
function start(mode,topic){let minutes=Number($('#duration')?.value||50);let qs=mode==='wrong'?bank.filter(q=>db.wrong.includes(q.id)):mode==='bookmarks'?bank.filter(q=>db.bookmarks.includes(q.id)):bank.slice();if(topic)qs=qs.filter(q=>q.set===topic);qs=qs.map(q=>{let opts=shuffle(q.options.map((text,index)=>({text,index})));return {...q,options:opts.map(o=>o.text),answer:opts.findIndex(o=>o.index===q.answer)}});if(!qs.length){alert('Chưa có câu trong danh sách này. Anh hãy luyện hoặc đánh dấu câu trước nhé.');return}if(mode!=='exam')qs=shuffle(qs);active={mode,qs,answers:{},revealed:{},i:0,end:Date.now()+minutes*60000};renderQuiz();if(mode==='exam')timer=setInterval(()=>{if(!active)return;let remain=Math.max(0,Math.ceil((active.end-Date.now())/1000));let el=$('#clock');if(el)el.textContent=fmt(remain);if(!remain)finish(false)},1000)}
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function renderQuiz(){let a=active,q=a.qs[a.i],ans=a.answers[q.id],show=a.revealed[q.id],done=Object.keys(a.answers).length;$('#app').innerHTML=`<div class="row"><div><div class="eyebrow" style="color:#627d50">${a.mode==='exam'?`THI THỬ · BỘ ĐỀ ${a.qs[0].set}`:'LUYỆN TẬP · PHẢN HỒI TỪNG CÂU'}</div><h2>Vững kiến thức, tự tin hơn</h2></div><button id="exit">Thoát</button></div><div class="quiz"><section class="panel"><div class="row"><span class="tag">Câu ${a.i+1}/${a.qs.length} · ${esc(q.level)}</span><button id="bookmark" aria-label="Đánh dấu câu">${db.bookmarks.includes(q.id)?'★ Đã đánh dấu':'☆ Đánh dấu'}</button></div><div class="question">${esc(q.text)}</div>${q.options.map((o,i)=>`<button class="option ${ans===i?'selected':''} ${show&&i===q.answer?'correct':''} ${show&&ans===i&&i!==q.answer?'wrong':''}" data-option="${i}" ${show?'disabled':''}><b>${'ABCD'[i]}</b><span>${esc(o)}</span></button>`).join('')}${show?`<div class="answer-note">${q.explanation?`<p>${esc(q.explanation)}</p>`:''}<b>${ans===q.answer?'✓ Trùng đáp án tài liệu':'Đáp án tài liệu: '+ 'ABCD'[q.answer]}</b><div class="muted">Nguồn dẫn trong file: ${esc(q.source)} · Câu gốc ${q.number}. Chưa thẩm định nguồn.</div></div>`:''}<div class="row" style="margin-top:22px"><button id="prev" ${a.i===0?'disabled':''}>← Trước</button>${a.mode!=='exam'&&!show?`<button class="primary" id="check" ${ans===undefined?'disabled':''}>Kiểm tra đáp án</button>`:''}<button id="next" ${a.i===a.qs.length-1?'disabled':''}>Tiếp →</button></div></section><aside class="panel">${a.mode==='exam'?`<div class="muted">Thời gian còn lại</div><div class="timer" id="clock">${fmt(Math.max(0,Math.ceil((a.end-Date.now())/1000)))}</div>`:'<h3>Tiến độ luyện tập</h3>'}<div class="muted">Đã chọn ${done}/${a.qs.length} câu</div><div class="progress"><i style="width:${done/a.qs.length*100}%"></i></div><div class="numbers">${a.qs.map((v,i)=>`<button data-jump="${i}" class="${a.answers[v.id]!==undefined?'selected':''} ${i===a.i?'current':''}">${i+1}${db.bookmarks.includes(v.id)?'★':''}</button>`).join('')}</div><button class="primary" style="width:100%" id="finish">${a.mode==='exam'?'Nộp bài':'Kết thúc & xem kết quả'}</button><p class="muted">${a.mode==='exam'?'Đáp án hiển thị sau khi nộp bài.':'Chọn phương án rồi nhấn Kiểm tra đáp án.'}</p></aside></div>`;document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{a.answers[q.id]=+b.dataset.option;renderQuiz()});document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{a.i=+b.dataset.jump;renderQuiz()});$('#prev').onclick=()=>{a.i--;renderQuiz()};$('#next').onclick=()=>{a.i++;renderQuiz()};if($('#check'))$('#check').onclick=()=>{a.revealed[q.id]=true;renderQuiz()};$('#bookmark').onclick=()=>{db.bookmarks=db.bookmarks.includes(q.id)?db.bookmarks.filter(id=>id!==q.id):[...db.bookmarks,q.id];save();renderQuiz()};$('#exit').onclick=()=>{if(confirm('Thoát lượt đang làm? Kết quả lượt này chưa được lưu.'))dashboard()};$('#finish').onclick=()=>finish(true)}
function finish(ask){if(!active)return;let a=active,missing=a.qs.length-Object.keys(a.answers).length;if(ask&&!confirm(missing?`Còn ${missing} câu chưa chọn. Anh muốn kết thúc và chấm bài?`:'Kết thúc và chấm bài?'))return;clearInterval(timer);let correct=a.qs.filter(q=>a.answers[q.id]===q.answer).length;for(let q of a.qs){if(a.answers[q.id]===q.answer)db.wrong=db.wrong.filter(id=>id!==q.id);else if(!db.wrong.includes(q.id))db.wrong.push(q.id)}let score=(correct/a.qs.length*10).toFixed(2);db.history.unshift({mode:(a.mode==='exam'?'Thi thử':'Luyện tập')+(a.qs.every(q=>q.set===a.qs[0].set)?' đề '+(a.qs[0].set):' tổng hợp'),date:new Date().toLocaleString('vi-VN'),correct,total:a.qs.length,score});db.history=db.history.slice(0,50);save();$('#app').innerHTML=`<section class="panel score"><span class="tag">ĐÃ HOÀN THÀNH</span><h1>Kết quả của anh</h1><strong>${score}<small style="font-size:20px">/10</small></strong><p>${correct}/${a.qs.length} câu trùng đáp án tài liệu · ${missing} câu chưa trả lời</p><div class="tools" style="justify-content:center"><button class="primary" id="again">Ôn câu sai</button><button id="back">Về tổng quan</button></div><p class="muted">Điểm luyện tập được quy đổi tuyến tính theo số câu đúng, không thay thế thang điểm hội thi.</p></section><h2 style="margin-top:28px">Xem lại bài làm</h2><section class="panel">${a.qs.map(q=>`<div class="review-item"><span class="tag">Đề ${q.set} · Câu ${q.number} · ${a.answers[q.id]===q.answer?'Đúng theo tài liệu':'Cần ôn lại'}</span><p><b>${esc(q.text)}</b></p><p class="muted">Nguồn dẫn trong file: ${esc(q.source)}</p>${q.options.map((o,i)=>`<p style="color:${i===q.answer?'#26763d':a.answers[q.id]===i?'#b35543':'inherit'}">${'ABCD'[i]}. ${esc(o)} ${i===q.answer?'✓ Đáp án tài liệu':''}${a.answers[q.id]===i?' · Anh chọn':''}</p>`).join('')}</div>`).join('')}</section>`;active=null;$('#again').onclick=()=>start('wrong');$('#back').onclick=dashboard;window.scrollTo(0,0)}
$('#home').onclick=$('#logo').onclick=e=>{e.preventDefault();if(!active||confirm('Thoát lượt đang làm? Kết quả lượt này chưa được lưu.'))dashboard()};dashboard();
</script></body></html>
